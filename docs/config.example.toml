# io-harness's configuration file, as `io setup` writes it.
#
# This is the harness's schema, not io-cli's — io-cli has no configuration parser
# and never will. Everything below except `[app.io-cli]` is read and validated by
# io-harness itself; `[app.io-cli]` is the section it deliberately leaves alone
# for whoever is building on top of it.
#
# Where this file goes. The order is io-harness's:
#
#   $IO_CONFIG                       a file, named outright
#   $IO_CONFIG_HOME/io.toml          a directory, named outright
#   $XDG_CONFIG_HOME/io/io.toml      unix
#   ~/.config/io/io.toml             unix, when XDG_CONFIG_HOME is unset
#   %APPDATA%\io\io.toml             Windows
#
# From 0.15.0 io-cli sets $IO_CONFIG_HOME to its own home — `~/.io-cli`, or
# `%USERPROFILE%\.io-cli` on Windows — before io-harness resolves anything, so
# the second row is what answers unless you have named a location yourself. Set
# $IO_CONFIG or $IO_CONFIG_HOME and io-cli sets nothing and moves nothing. The
# run store `runs.db` sits beside this file wherever this file ends up, and on
# the first 0.15.0 run an existing pair is moved into the home together, each
# file named on screen, nothing overwritten and nothing deleted.
#
# A project's own `io.toml` and a gitignored `io.local.toml` layer on top.

# --- The provider -----------------------------------------------------------
#
# One of: openrouter, anthropic, openai, compatible.
#
# `api_key` absent means the provider's own environment variable —
# OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY. That is the better
# arrangement, not a fallback: a key that is never on disk cannot leak from disk.
# An environment variable always wins over a key written here.

[[provider]]
kind = "openrouter"
model = "anthropic/claude-sonnet-4"
# api_key = "sk-or-v1-..."   # written mode 0600 when the wizard writes it

# Any OpenAI-shaped endpoint — a proxy, a gateway, a local runtime. Exactly one
# of `preset` and `base_url`.
#
# [[provider]]
# kind = "compatible"
# base_url = "http://localhost:11434/v1"
# model = "llama3.2"
# auth = "none"

# --- The permission boundary ------------------------------------------------
#
# What the agent may do before anything asks. The three postures the wizard
# offers are exactly these three shapes:
#
#   sandboxed workspace   read/write/exec allow, net deny
#   ask before writes     read allow, write/exec ask, net deny
#   read only             read allow, write/exec/net deny
#
# `ask` stops the turn and asks in an overlay. It was answered by declining
# through 0.1.1, and the release that changed it said so at the time: a posture
# whose behaviour is not what its name suggests has to say so rather than imply
# otherwise. In a headless `io exec` run `ask` is still a decline, because nothing
# there can answer it — see the README.
#
# NOTE: a PROJECT-scoped file may narrow this and may never widen it — a
# repository you cloned must not be able to grant itself permission. Widening
# belongs in the user-scope file, which is where `io setup` writes.

[policy.defaults]
read = "allow"
write = "allow"
exec = "allow"
net = "deny"

# Named layers, evaluated after the built-in ones. A later layer may add
# capability and may never re-allow an earlier deny.
#
# [[policy.layers]]
# name = "no-secrets"
# rules = [{ act = "read", effect = "deny", pattern = ".env" }]

# --- What bounds a turn, in a session and in `io exec` alike (0.14.0) --------
#
# Every section below is io-harness's own — read and validated by it — and every
# one of them reaches BOTH arms. A session turn and an `io exec` run build their
# contract from the same call, so what you write here has the same effect in your
# terminal as it has in CI.
#
#   [sandbox]              resource limits and network allowances for a
#                          contained command
#   [run]                  the step, token and duration budgets, the retry,
#                          stall and context policies, the exec timeout, the
#                          read ceiling and the skills directory
#   [run.commit_identity]  who a commit the agent makes is authored as. It is
#                          INSIDE [run]: a file with no [run] table has none.
#   [instructions]         AGENTS.md and whatever else you point it at
#   [[mcp]]                MCP servers. Merged with [[app.io-cli.mcp]] below.
#   [[lsp]]                language servers. Merged with [[app.io-cli.lsp]].
#   [[agent]]              the roster a fan-out draws its children from
#   [web]                  provider-executed search and fetch
#   [memory]               how much durable memory a run may keep
#   [[plugin]]             capability bundles, declared by path. 0.20.0; see the
#                          block below
#   [[hook]]               what to do on an event, or in front of a tool call.
#                          Parsed and inert before 0.20.0; see the block below
#
# THIS BLOCK USED TO SAY THE OPPOSITE, and the reason it gave went stale a
# release before the block did. Through 0.13.1 these sections reached `io exec`
# and nothing else, because the harness's steerable session turn built its own
# contract and took none from the caller. That stopped being how a session runs
# in 0.11.0, when the ordinary turn moved to an entry point that does take one —
# and Ctrl+C survived the move, because an interrupt travels on the observer
# rather than through a steer inbox. What was left was an omission rather than a
# constraint, and 0.14.0 closes it.
#
# WHAT CHANGES FOR A FILE YOU ALREADY HAVE. A [run] block written for CI now
# bounds your terminal too. `max_steps = 20` is a reasonable thing to have set
# for an unattended run and an unreasonable cap on a conversation — so if that is
# what this file says, it is now what your session says. The status line carries
# each budget in force with what is left of it, and `/status` lists them all, so
# a turn that will stop at a ceiling says which one before it gets there. An
# operator who wants [run] for CI only moves it to a project file or narrows it
# by scope.
#
# [web] IS A CAPABILITY AND NOT A PREFERENCE. It gives the model the provider's
# own search and fetch, and the VENDOR is what dials the URL — so the `net` rule
# in [policy.defaults] above is not what governs it. That rule decides what THIS
# machine may reach. Writing [web] here turns the capability on for every session
# as well as for every CI run, from a file that previously did nothing; the
# session says so, in its own words, when it starts.
#
# [browser] is io-harness's too and is applied the same way, but it is REFUSED IN
# A PROJECT-SCOPED FILE by io-harness itself: it names a program to execute, and
# a project's io.toml arrives with a `git clone`. It works in the user-scope file
# — the one `io setup` writes, and the one this example documents — and there is
# no project-scope route to a browser at all. io-cli's own [app.io-cli.browser]
# is below, and reaches a turn from either scope.
#
# The keys themselves, by section. `/config` lists every one of these with the
# value in force and the file that decided it, so this block is the written form
# of a surface you can now open in a session — and each key is left commented,
# because a key present with its own default is a key a reader has to wonder
# about.
#
# [run]
# max_steps = 40             # how many steps one turn may take
# max_tokens = 250000        # the token ceiling for one turn
# max_duration_secs = 900    # wall clock for one turn
# max_retries = 3            # how many times a failed step is retried
# exec_timeout_secs = 120    # how long one command may run
#
# [sandbox]
# mode = "workspace-write"   # read-only | workspace-write | full-access
# allow_network = false      # whether a contained command may reach the network
# force_floor = true         # keep the floor even where the caller asked for less
#
# NOTE on the three sandbox keys above: `allow_network = true`, `force_floor =
# false` and `mode = "full-access"` are each REFUSED in a project-scoped file by
# io-harness itself, for the reason the policy note above gives. `/config` shows
# you the harness's own sentence when a write would do that, rather than a
# summary of it.
#
# [memory]                   # bounds the STORE, which outlives every run over it
# max_entries = 500          # how many durable entries are kept
# max_chars = 200000         # the total size of them
# max_entry_chars = 4000     # the size of any one of them

# --- MCP servers ------------------------------------------------------------
#
# The shape `/mcp` writes, and the shape `/import` translates another tool's
# servers into. io-cli defines no schema for one — this is io-harness's own, with
# the TRANSPORT AS A TAG beside the other fields rather than as a nested table.
#
#   id           what the server is called
#   transport    "stdio" for a program on this machine, "http" for a URL
#   command      the program, for a stdio server
#   args         its arguments, as an ARRAY — never a shell string
#   env          variables handed to that program
#
# A CREDENTIAL IS A REFERENCE AND NOT A LITERAL. io-harness resolves ${env:NAME}
# from the environment at the moment it reads this file, so the secret stays in
# your shell and never lands here. A substitution RESOLVES OR FAILS and never
# empties: a variable that is not set is an error naming the key, rather than a
# server that starts holding an empty token and fails somewhere less obvious.
# `/import` writes exactly this form — it reads the NAMES of another tool's
# environment variables and never their values — and tells you which variables
# your shell has to have.
#
# ${file:PATH} and ${cmd:PROGRAM ARGS} are the other two forms. ${cmd:} is
# REFUSED in a project-scoped io.toml, because that file arrives with a
# `git clone`.
#
# NO TILDE, HERE OR ANYWHERE IN THIS FILE. io-harness expands none: those three
# substitutions are the whole of what it rewrites, so a leading `~` in a value is
# a directory literally named `~`. Write the path out, or use ${env:HOME}. The
# one exception is io-cli's own `skills` key further down, which io-cli expands
# itself before io-harness ever sees it.
#
# [[mcp]]
# id = "github"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { GITHUB_TOKEN = "${env:GITHUB_TOKEN}" }
#
# [[mcp]]
# id = "issues"
# transport = "http"
# url = "https://mcp.example.com/v1"

# --- Capability bundles (0.20.0) --------------------------------------------
#
# A bundle is a directory with a `plugin.toml` in it, and it is loaded because
# THIS FILE NAMES IT. There is no directory io walks looking for bundles and no
# registry it fetches from: a `[[plugin]]` entry is the whole of installing one,
# and deleting the entry is the whole of removing one.
#
# One directory can contribute six kinds of thing at once — skills, prompt
# templates, [[agent]] definitions, [[mcp]] servers, [[hook]] tables and policy
# layers — which is why there is a surface for it. `/plugin` lists what loaded,
# what each bundle contributed, and every bundle that was declared and DROPPED
# with io-harness's own reason beside it. That loader has no error path: a
# dropped bundle is recorded and otherwise silently absent while every other one
# loads.
#
# WHICH FILE DECLARES A BUNDLE DECIDES WHAT IT MAY CONTRIBUTE. A bundle named in
# the project-scoped io.toml — the file a `git clone` delivers — may contribute
# skills, templates, agents and policy, and may NOT contribute hooks or MCP
# servers, because both of those run a program on this machine. One that tries is
# refused WHOLE: it contributes nothing at all, not the half that would have been
# safe. Name it from io.local.toml or from this user-scope file and the same
# directory loads completely. The rule is about which file, not about the bundle.
#
# A BUNDLE'S POLICY MAY ONLY DENY. A `[policy] defaults` table in a manifest is
# refused by name, and a single rule whose effect is not `deny` drops the bundle.
# So the worst a bundle can do to the boundary above is narrow it.
#
# An id must match [a-z0-9][a-z0-9-]{0,31}, and every agent name, MCP server id
# and policy layer name a bundle contributes is rewritten to `<bundle>__<name>`
# by io-harness at load. That is the name a refusal, a call and a spawn will all
# use, and the name `/plugin` draws.
#
# io-cli CANNOT LIST A BUNDLE'S HOOKS. io-harness's `Hook` type is private and
# there is no accessor, so `/plugin` reports that a bundle contributed hooks and
# nothing about how many there are or what they run.
#
# [[plugin]]
# path = "~/bundles/rust-review"

# --- Hooks (0.20.0) ---------------------------------------------------------
#
# What to do when something happens. PARSED AND INERT BEFORE 0.20.0 — a table
# here was read, accepted and then installed on nothing, so a file asking for
# every event to be written to a log produced an empty file and no error. From
# 0.20.0 hooks run in a session turn and in an `io exec` run alike.
#
# A hook either writes events down or runs a program, and exactly one of `append`
# and `run` says which — a hook that did both would be a hook whose failure meant
# two things. `on` and `at` are mutually exclusive: `on` observes events, `at`
# gates a tool call, and an `at` hook must have a `run`.
#
#   on           the event names to observe. EMPTY MEANS EVERY EVENT
#   at           "before_tool", which is the only one there is
#   tools        for an `at` hook, which tool calls it sees
#   append       a file to append one JSON line per event to
#   run          argv, NEVER a shell string: nothing is word-split or expanded
#   on_failure   continue | cancel | refuse
#   timeout_ms   5000 when absent
#
# `on_failure` is where a hook's power actually is. `continue` lets the turn go
# on, which is what an audit hook wants. `cancel` ends the turn at the next step
# boundary and the run STAYS RESUMABLE — it is a stop, not a crash. `refuse`
# turns that one tool call back and leaves the turn running, which makes a
# `before_tool` hook a rule of your own standing beside the policy engine's.
#
# A PROJECT-SCOPED FILE MAY NOT DECLARE [[hook]] AT ALL, and io-harness refuses
# the WHOLE configuration rather than dropping the table — a hook runs a command
# on this machine, and io.toml is the file a `git clone` delivers. There is no
# Config to be had, so io genuinely cannot start against such a file; what 0.20.0
# changed is that it prints io-harness's own sentence, which names the key, the
# reason and the two files that may carry it, instead of a bare error string.
# Write the table here or in io.local.toml.
#
# [[hook]]
# on = []                       # every event
# append = "audit.jsonl"
#
# [[hook]]
# at = "before_tool"
# tools = ["shell"]
# run = ["./scripts/gate.sh"]
# on_failure = "refuse"
# timeout_ms = 5000

# --- io-cli's own section ---------------------------------------------------
#
# Eight keys and five tables. io-harness does not validate any of it, so an
# unrecognised VALUE reads as the default rather than stopping a session. A
# table io-harness cannot parse at all is different: the session starts on the
# defaults and says so, carrying the harness's own message.

[app.io-cli]
# "dark" or "light". Absent means detect from the terminal background.
theme = "dark"
# How much of a change a diff shows.
#
#   "unified"  the hunk as the harness stored it, context and all. The default,
#              and what an absent key means — so a file written before 0.3.0
#              needs no change.
#   "minimal"  the changed lines and the @@ header, without the context. For
#              reviewing by file rather than by hunk.
diff = "unified"
# Which marks to draw with: "unicode" or "ascii".
#
# Absent — the default — asks the locale: LC_ALL, then LC_CTYPE, then LANG, and
# the first one PRESENT decides, whatever it says. Name a set here when the locale
# is right about the encoding and wrong about the font, which is what a working
# indicator drawn as boxes looks like.
#
# Independent of colour in both directions: the ASCII set arrives at a fully
# coloured theme, and NO_COLOR keeps the Unicode marks.
#
# glyphs = "ascii"
#
# Run every session in plain mode: no animation, the ASCII set forced, and each
# state the session enters committed to the scrollback as a line of text. The same
# switch as `--plain`, and the flag wins — there is no `--no-plain`, so a file that
# says true here cannot be turned off for one run.
#
# false is the default and what an absent key means; it is written out so the file
# says which way round it is.
plain = false
#
# How many steps one turn may take.
#
# DEPRECATED IN 0.14.0 AND REMOVED IN 0.16.0. It existed because the flat turn
# once had no way to raise io-harness's own cap of twelve, and `[run] max_steps`
# above does the same job from a table io-harness documents itself. It is no
# longer read at all: a file still carrying it is told so once at session start,
# with the steps it asks for named and the key they move to. A file with neither
# key gets io-cli's own floor of a thousand, which is not a budget you set and
# therefore draws no field on the status line.
#
# max_steps = 40

# The session's own keys, by action name. Absent means the defaults, which are the
# ones in the README's table; every line below states its default and so changes
# nothing.
#
# A binding is a chord, or two chords separated by a space. Modifiers are ctrl,
# alt and shift, joined to the key with +, in any order and any case. A key is a
# single character, a named key (esc, enter, tab, backtab, space, up, down, left,
# right, home, end, pageup, pagedown, backspace, delete, insert) or f1 .. f12.
# Because + is the join, + itself cannot be bound.
#
# `interrupt` — Ctrl+C — is absent because it cannot be moved, and naming it here
# earns a refusal rather than being ignored: it is the key that interrupts a
# running turn and leaves io, and a file able to take it away is one able to lock
# you inside a running agent. Putting any other action onto ctrl+c is refused for
# the same reason.
#
# A line that cannot be read leaves its action on the default and says which key
# it kept; a name that is no action says which names there are. Neither stops the
# session, and `/help` always shows the keys actually in force.

[app.io-cli.keys]
exit = "ctrl+d"
posture = "shift+tab"
clear = "ctrl+l"
transcript = "ctrl+t"
rewind = "esc esc"
fleet = "ctrl+f"

# The caps a fan-out runs under. **This table is what lets the agent decompose a
# task at all**, and it is absent by default: io-harness has one session entry
# point that reaches its spawn loop, and these caps are what selects it.
#
# What it costs is smaller than it was, and it is not a mode. No session turn
# takes a steer inbox — none has since 0.11.0 — so a contained turn gives up no
# steering an ordinary one has. `Ctrl+C` still ends it, at the next point where no
# child is in flight, and `/contain off` gives the next turn back.
#
# THROUGH 0.11.0 THIS TABLE DECIDED EVERY KEY BELOW IT, AND IT NO LONGER DOES.
# io-harness's contained turn was then the only session entry point that took a
# caller's task contract, so a responder, a plan gate, MCP servers, language
# servers, a browser and a skills directory all rode this one switch. 0.11.0 gave
# the ordinary turn a contract too, and 0.14.0 gave it the configuration file as
# well. Every one of those reaches every turn now, and this table means exactly
# what its name says: the caps a fan-out runs under.
#
# All four keys are required, because there is no safe default for somebody
# else's token ceiling.
#
# max_total_agents refuses: the spawn that would cross it comes back to the
# parent, which adapts. max_concurrent_agents throttles: a spawn past it waits
# for a slot, per tier, so a fleet drains rather than failing. max_depth counts
# from the root, which is 0. max_total_tokens is the whole tree's, drawn down
# together — tokens, because a provider reports tokens and never money.
#
# [app.io-cli.containment]
# max_total_agents = 12
# max_concurrent_agents = 4
# max_depth = 2
# max_total_tokens = 200000

# The three ceilings io-harness has no configuration key for. They are
# TaskContract fields, so io-cli names them in its own section — and it applies
# them in the half a session turn and an `io exec` run share, so what you write
# here bounds your terminal exactly as it bounds CI.
#
# max_parallel_reads = 10          # read-only tool calls at once; 0 clamps to 1
# spawn_background_after_secs = 120  # when a slow child is backgrounded
# detached_spawns = true           # whether a spawn may detach at all

# --- io-cli's own capabilities ----------------------------------------------
#
# Every setting below reaches EVERY turn, contained or not. These are fields of
# io-harness's `TaskContract`, and both a session turn and an `io exec` run hand
# it one.
#
# They are also the strongest layer of the five: applied after `Config::apply_to`,
# so a server named here beats one of the same id in the top-level [[mcp]] or
# [[lsp]] — the two lists are merged rather than replaced, and the session names
# the duplicate it dropped when a file writes an id in both places.
#
# A directory of skills for the agent. They appear in the `/` palette by name,
# and choosing one puts `use the <name> skill: ` in the prompt — the file itself
# is read by the MODEL, through a tool, under this session's own policy. Both
# layouts are discovered: `skills/migrations.md` and `skills/api-style/SKILL.md`.
#
# Absent, this is `~/.io-cli/skills`, so writing the key is how you point at a
# directory somewhere else rather than how you turn skills on. A leading `~` is
# your home directory: io-harness substitutes `${env:...}`, `${file:...}` and
# `${cmd:...}`, and a tilde is none of the three — so io-cli expands it itself
# before handing the path over. A `~` anywhere but the front is a directory
# literally named `~`.
#
# THE CEILING IS PER DIRECTORY. io-harness accepts at most 64 skills in one and
# rejects the whole directory rather than the excess — but every capability
# bundle a [[plugin]] entry declares brings a skills directory of its own, and
# the totals are not bounded together.
# Six bundles can put far more than 64 names in front of the model with nothing
# failing anywhere. `/skills` lists every one of them, bundle skills included,
# under the `<bundle>__<name>` the model actually addresses.
#
# skills = "~/.io-cli/skills"

# MCP servers, in io-harness's own shape — io-cli defines no schema for one. The
# transport is a tag beside the rest of the fields rather than a nested table.
# The status line names each server that actually answered and how many tools it
# offered, which is a different fact from the one written here.
#
# [[app.io-cli.mcp]]
# id = "docs"
# transport = "stdio"
# command = "mcp-server-docs"
# args = []
#
# [[app.io-cli.mcp]]
# id = "issues"
# transport = "http"
# url = "https://mcp.example.com/v1"

# Language servers for this workspace. `extensions` is what routes a file to one.
#
# [[app.io-cli.lsp]]
# id = "rust-analyzer"
# command = "rust-analyzer"
# extensions = ["rs"]

# A browser the agent may drive. It is one you already have — nothing is ever
# downloaded — and every navigation it attempts, including redirects and clicks
# nobody typed, is decided by this session's policy. The status line shows the
# last host and whether it was allowed or refused.
#
# [app.io-cli.browser]
# binary = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# headless = true
