version: 2

# Dependabot opens its pull requests against the DEFAULT branch unless told
# otherwise, and this repository's default branch is `main`. `main` takes nothing
# but a release merge from `develop`, so a bot PR into it would bypass the whole
# flow. Every ecosystem here targets `develop` explicitly.
#
# The cost of that line is real and worth stating: GitHub does not raise
# Dependabot *security* updates against a non-default target branch. Security
# advisories have to be acted on by hand here, through the same develop -> main
# path as any other change.
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch bumps instead of a dozen. This crate is a binary,
      # so a patch bump moves Cargo.lock and nothing anybody resolves against.
      patch-updates:
        update-types: ["patch"]
    # **There is no `ignore` list any more, and the two entries that were here are
    # worth their notes.**
    #
      # The `ratatui` entry that stood here is GONE as of 0.18.0, and the note it
      # carried is worth keeping because of how it ended. It said the composer was
      # `tui-textarea` 0.7 built against exactly ratatui 0.29 and crossterm 0.28,
      # that upstream had published nothing since 2024-10, that bumping either
      # crate put two crossterm versions in the tree and stopped the build, that
      # Dependabot had raised exactly that pair and both PRs were closed — and
      # "delete them the day tui-textarea publishes a release against the 0.30
      # line."
      #
      # It never did. Twenty-two months on, 0.7.0 was still both the newest
      # release and the state of upstream `main`, and the freeze had acquired a
      # cost: ratatui 0.29 required `lru ^0.12.0`, and `lru` carried
      # GHSA-rhfx-m35p-ff5j (Dependabot alert #1) with the fix landing in 0.16.3
      # and never backported to the 0.12 line. Because tui-textarea required
      # ratatui through EVERY feature path it had — `no-backend` included —
      # bumping io-cli's own ratatui would have left both 0.29 and 0.30 in the
      # graph and closed nothing. So the dependency was removed rather than
      # bumped: the editing model is `src/editor.rs` now, and ratatui is on 0.30.
      #
      # **Alert #1 closed as `fixed`, not dismissed**, at 2026-08-26T14:57:27Z —
      # the moment the merge put `lru 0.18.2` in `Cargo.lock`. The plan had been
      # to dismiss it as not-reachable, and the plan was overtaken: a dependency
      # change that moves the version out of range closes the alert on its own,
      # and a dismissal on top would have recorded a waiver for something that was
      # actually repaired. Check an alert's state after the merge before
      # dismissing anything.
      #
      # The unreachability evidence is kept because it is why this was never
      # urgent, and why the release could be planned around the migration rather
      # than rushed: in ratatui 0.29 `lru` backed the layout cache only
      # (`src/layout/layout.rs:9` and `:31`), and `iter_mut` appears nowhere under
      # `ratatui-0.29.0/src/layout/` — so `lru::IterMut`, the entire subject of the
      # advisory, was never constructed on any path this binary could reach.
      #
      # What holds the tree clean from here is a gate rather than a judgement:
      # `ratatui-core` 0.30 takes a current `lru`, and
      # `tests/dependencies.rs::n1_the_composer_is_free_and_no_lru_is_in_the_advisorys_range`
      # fails the build if any `lru` in the lockfile falls inside the range.
      #
      # **The `crossterm` entry that stood here is GONE as of 0.22.0**, and it went
      # the way it said it would. It held the direct `crossterm` at 0.28 because
      # ratatui 0.30 was taken with the `crossterm_0_28` feature and a bot bumping
      # one without the other would put two versions in the tree — and it named the
      # exit: "moving to crossterm 0.29 is a deliberate change of that feature flag
      # and this entry together, not a bot's to make." 0.22.0 made it. `Cargo.toml`
      # now carries `crossterm_0_29` and `crossterm = "0.29"`, changed in one
      # commit, and there is nothing left for this entry to hold back.
      #
      # Nothing replaces it. The property that entry was protecting — one crossterm
      # in the tree — is not a judgement a list of ignores can keep: it is the two
      # lines in `Cargo.toml` agreeing, and a future bot PR that moves the direct
      # crate alone fails to build rather than passing quietly.

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
