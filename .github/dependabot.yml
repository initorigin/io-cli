version: 2

# Dependabot opens its pull requests against the DEFAULT branch unless told
# otherwise, and this repository's default branch is `main`. `main` takes nothing
# but a release merge from `develop`, so a bot PR into it would bypass the whole
# flow. Every ecosystem here targets `develop` explicitly.
#
# The cost of that line is real and worth stating: GitHub does not raise
# Dependabot *security* updates against a non-default target branch. Security
# advisories have to be acted on by hand here, through the same develop -> main
# path as any other change.
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch bumps instead of a dozen. This crate is a binary,
      # so a patch bump moves Cargo.lock and nothing anybody resolves against.
      patch-updates:
        update-types: ["patch"]
    ignore:
      # The composer is `tui-textarea` 0.7, and it is built against exactly
      # ratatui 0.29 and crossterm 0.28. Upstream has published nothing newer
      # since 2024-10, so bumping either crate puts two crossterm versions in the
      # tree and the build stops: `Input: From<crossterm::event::KeyEvent>` and
      # `&TextArea: Widget` both stop resolving. Dependabot raised exactly that
      # pair and both PRs were closed rather than merged. These two entries are
      # what keeps it from raising them again every week; delete them the day
      # tui-textarea publishes a release against the 0.30 line. Both crates are
      # pre-1.0, so the minor bump is the breaking one — patches still come
      # through.
      - dependency-name: ratatui
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: crossterm
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
