name: release

# Pushing the tag is what cuts the Release. `gh release create` is never used: it
# produces a Release with no assets, and the assets ARE the product here — there
# is no registry and no other channel, so a Release without them is an install
# path that does not work.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0). Must equal Cargo.toml's version."
        required: true
        type: string
      dry_run:
        description: "Build, smoke and checksum every target, then stop: no Release, no tag."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cheap and first: a tag that does not match the manifest would cut a Release
  # labelled with a version it was not built from, and five cross-compiles is an
  # expensive way to find that out.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: resolve
        env:
          DISPATCH: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH" ]; then
            version="$DISPATCH"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag says $version, Cargo.toml says $manifest"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  # Five artifacts. musl for Linux deliberately: one static binary that runs on
  # any distribution beats two glibc builds and a support question about which
  # one a user needs.
  build:
    needs: [checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One target failing must not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          # Built on an arm64 runner rather than cross-compiled, so the smoke
          # below runs the binary on the architecture it ships for.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # io-harness carries rusqlite with a bundled C SQLite, so a musl target
      # needs a musl C compiler in the job. Without it the build fails inside a
      # dependency's build script, which reads like a toolchain bug and is not
      # one. This is the row most likely to break and the reason it was proved
      # before the release branch depended on it.
      # Both Linux rows build on a runner of their own architecture, so the
      # distribution's musl-gcc is the right compiler for each.
      - if: endsWith(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          lower=$(echo "$TARGET" | tr '-' '_')
          upper=$(echo "$lower" | tr '[:lower:]' '[:upper:]')
          echo "CC_${lower}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Run it. A binary that builds and will not start is the failure a release
      # profile hides from a test profile, and it costs one line to rule out on
      # every target the runner can execute.
      - if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ./target/${{ matrix.target }}/release/io.exe --version
          else
            ./target/${{ matrix.target }}/release/io --version
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="io-$VERSION-$TARGET"
          mkdir -p "dist/$stage"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/$TARGET/release/io.exe" "dist/$stage/"
          else
            cp "target/$TARGET/release/io" "dist/$stage/"
          fi
          cp LICENSE NOTICE README.md CHANGELOG.md "dist/$stage/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$stage.zip" "$stage" >/dev/null
          else
            tar czf "$stage.tar.gz" "$stage"
          fi
          rm -rf "$stage"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The file the installers verify against before they unpack anything. It
      # covers every artifact in one document, so a partial upload is visible as a
      # missing line rather than as a checksum that happens to match.
      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
          test "$(grep -c . SHA256SUMS)" -eq 5 || {
            echo "::error::expected five artifacts, got $(grep -c . SHA256SUMS)"
            exit 1
          }

      - name: Notes
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ### Install

          macOS and Linux:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/initorigin/io-cli/main/install.sh | sh
          ```

          Windows, in PowerShell:

          ```powershell
          irm https://raw.githubusercontent.com/initorigin/io-cli/main/install.ps1 | iex
          ```

          Or with a package manager:

          ```sh
          brew tap initorigin/io-cli https://github.com/initorigin/io-cli
          brew install initorigin/io-cli/io
          ```

          ```powershell
          scoop bucket add io-cli https://github.com/initorigin/io-cli
          scoop install io
          ```

          The tap and the bucket are updated from this Release's own
          `SHA256SUMS` shortly after it is published, so they may serve the
          previous version for a few minutes.

          Both scripts verify the artifact against `SHA256SUMS` before unpacking
          it and install into a per-user directory with no administrator rights.
          The checksum defends against a truncated download and a tampered asset;
          `curl | sh` is a trust-the-publisher model regardless.

          `io upgrade` prints the command that updates whichever of these
          installed the binary you are running.
          EOF
          cat notes.md

      # Release titles are the bare form this line of repositories uses:
      # "io-cli 0.1.0".
      # A dry run stops here: everything above has been built and checked, and
      # nothing below it can be undone once a tag exists.
      - if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.checks.outputs.version }}
          name: io-cli ${{ needs.checks.outputs.version }}
          body_path: notes.md
          files: dist/*
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fail_on_unmatched_files: true

      - name: What is left for a human
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          echo "::notice::Released io-cli $VERSION. By hand:"
          echo "::notice::  1. run install.sh on a clean macOS machine and in a clean Linux container"
          echo "::notice::  2. run install.ps1 on a clean Windows machine"
          echo "::notice::  3. in each case run 'io --version' in a NEW shell"
          echo "::notice::There is no registry publish. The Release is the whole channel."

  # Every outside contributor thanked where they will see it: one comment on
  # each of their pull requests in the release, and on each issue of theirs a
  # pull request in it closed, naming the Release (.github/contributors.sh thank,
  # which skips anything already thanked for this tag). Its own job, so the one
  # token that can comment holds nothing else. Tag pushes only: a dispatch has
  # no tag to compare against the previous one.
  thank:
    needs: [release]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Thank contributors
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/contributors.sh thank "$GITHUB_REF_NAME"
