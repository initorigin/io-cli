id: io-cli
name: IO CLI
classification: independent-product
vision: >
  The terminal agent that shows you what it is allowed to do, what it is spending, and what it
  refused — while it works. Every other terminal agent renders a chat log with tool cells, because a
  chat log with tool cells is all its core can describe. io-harness records the permission boundary,
  the spend ceiling and the agent tree as first-class facts, and io-cli is the interface that makes
  them visible.
users:
  - >
    The initorigin author, as the first and most demanding user — running real work in real
    repositories, on macOS and Linux, over SSH and inside tmux.
  - >
    (later) A developer who owns their own provider keys and wants an agent they can watch, stop,
    and audit, rather than one they have to trust.
problems:
  - >
    The archived io-cli was a fork of a 1.2M-line, 88-crate agent product. Roughly sixty of those
    crates — the loop, the providers, the sandbox, the policy engine, the tool set, the session store
    — duplicate io-harness. Its terminal interface could not be extracted from it: the TUI crate
    alone is 229k lines across 402 files and depends on 41 sibling crates. Whitelabeling a second
    harness in order to attach the first one is work with no end.
  - >
    The category's most-complained-about decision is the alternate screen buffer. Agents that take
    the full terminal destroy native scrollback, terminal search, tmux copy-mode and mouse selection,
    duplicate their output on resize, and corrupt multi-byte text on copy. Users open issues titled
    as regressions and vendors ship environment variables to undo it.
  - >
    Terminal agents built on React-for-the-terminal repaint far more than changed, and strobe while
    streaming. The flicker is structural, not a bug to be fixed.
  - >
    Capturing the mouse to implement scrolling breaks the terminal's own text selection, and the
    workarounds are terminal-specific modifier keys or a toggle that trades scrolling for copying.
  - >
    No terminal agent in the field is usable with a screen reader. They hide the cursor — the only
    focus indicator — animate constantly, re-render unchanged content, and put metadata ahead of
    content. Blind developers report the whole category as effectively unusable.
  - >
    A first run typically fails on a missing environment variable, or funnels the user into one
    vendor's login. There is no guided path from "installed" to "working" for a developer bringing
    their own key.
  - >
    A developer running an agent on real work cannot see the boundary it is operating under. When an
    action is refused they are told that it was, not which rule refused it or which layer that rule
    came from — because no other core records it.
outcomes:
  - >
    A developer installs io-cli, is walked through provider, credential, model, theme and permission
    posture in one guided flow, and completes a real task in the same session.
  - >
    The conversation is in the terminal's own scrollback when the session ends. It can be scrolled,
    searched, selected and copied with the terminal's own facilities, because io-cli never took them
    away.
  - >
    At any moment the operator can see, in one line, which model is answering, which policy layer is
    in force, how full the context is, what has been spent against the ceiling, and whether the run
    is contained.
  - >
    A refusal names the act, the target, the rule and the layer. An approval stops the run in an
    overlay that cannot scroll away, shows the diff, and records the decision in both the transcript
    and the durable trace.
  - >
    The same run, unattended, emits the same events as newline-delimited JSON with no TUI code on the
    path — so what CI runs is what the developer watched, not a second implementation.
requirements:
  - >
    Hybrid inline rendering — finished turns are committed into the terminal's real scrollback;
    a short viewport at the bottom holds the composer, the status line and modal overlays. No
    alternate screen buffer exists in the product, in any mode, behind any flag.
  - >
    Flicker discipline — synchronized output around every frame, coalesced token events, and no
    full-screen clear during a normal session.
  - >
    Mouse capture off by default, with explicit copy affordances (system clipboard over OSC 52 so it
    works across SSH) instead of pointer interception.
  - >
    A composer with multiline input, prompt history, slash-command palette, workspace file
    completion, a raw shell escape, and large pastes converted to attachments.
  - >
    A single Picker overlay component, used by onboarding, model selection, theme selection, session
    resume, session fork and approvals — so those surfaces are visibly one product.
  - >
    Guided first-run onboarding — provider, credential (with a live verification call), model,
    theme with live preview, and default permission posture — writing io-harness's own configuration
    file.
  - >
    Approval overlays that show act, target, the asking rule and, for a write, the diff; resolved by
    key, recorded to history and to the trace.
  - >
    Policy posture cycling on one key, backed by io-harness policy layers rather than bespoke flags,
    with the active layer named in the status line.
  - >
    Diff rendering — unified by default, word-level emphasis inside changed lines, syntax
    highlighting, collapsed context, a defined narrow-terminal form, and a minimal mode.
  - >
    Collapsed tool cells with an expander; full output goes to the durable trace, not to the screen.
  - >
    A status line carrying model, policy layer, context pressure, tokens, spend against the tree
    ceiling, containment state and elapsed time.
  - >
    Session resume and fork over the harness store, and mid-session model switching.
  - >
    A fleet surface — the live agent tree with each child's draw against the shared ceiling.
  - >
    Headless execution — a non-interactive subcommand emitting the same event stream as NDJSON,
    with meaningful exit codes.
  - >
    A plain mode built for screen readers: no animation, no repaint of unchanged lines, the real
    cursor as the focus indicator, content before metadata, and every state change announced as one
    line of text.
  - >
    Theming as a small token set with shipped themes, terminal background detection, and `NO_COLOR`
    honoured; colour is never the sole carrier of meaning.
  - >
    A documented keybinding table, with the Kitty keyboard protocol used when advertised and a clean
    degradation over SSH to a legacy terminal.
  - >
    Inline image rendering where the terminal supports Kitty, iTerm2 or Sixel, with a half-block
    fallback.
constraints:
  - >
    **io-cli contains no agent loop, no provider client, no tool implementation, no sandbox, no
    policy engine and no session store.** All of it is io-harness. io-cli is a renderer of run
    events, an editor of prompts, and a keyboard. If a release needs one of those, it is added to
    io-harness and consumed — never reimplemented here. This is the constraint the archived fork
    violated and the one that keeps this product small.
  - >
    No configuration parser. io-harness owns discovery and layering; io-cli's own settings live in
    the `[app.io-cli]` section that io-harness deliberately does not validate.
  - Rust binary named `io`; ratatui over crossterm; async on tokio.
  - Apache 2.0, matching the rest of the initorigin open-source line.
  - >
    Runs locally on the developer's machine. No daemon, no client/server split, no second process.
    A separate TUI process talking to a server is how the archived fork's architecture began.
  - >
    Credentials are API keys — from the environment, or from io-harness's configuration file written
    `0600`. No OAuth and no subscription authentication, matching io-harness's own boundary.
  - >
    80×24 is a supported terminal size, not a degraded one. Every surface has a defined narrow form.
  - Stay 0.x. A breaking change is a minor bump; a 1.0.0 is not planned.
public_contract: >
  A command-line interface: the `io` binary, its subcommands, its flags, its slash commands, its
  keybinding table, its `[app.io-cli]` configuration section, and the NDJSON event shape emitted by
  the headless subcommand. The Rust API of the crate is not a public contract — io-cli is a binary,
  not a library.


  The install path is part of the contract too: the URLs of `install.sh` and `install.ps1`, and the
  naming of the release artifacts they resolve, must keep working across releases. A user's install
  command is the first thing they depend on and the last thing that should churn.
deployment_context: >
  Local, single-user. Installed by a `curl` shell script on macOS and Linux, or a PowerShell script
  on Windows, each fetching a prebuilt binary from the GitHub Release and verifying it against the
  checksums published beside it. Installed into a per-user directory, requiring no administrator
  rights. Run in the developer's own terminal. No service, no server, nothing to operate.
success_measures:
  - >
    A developer with no configuration reaches a completed real task — an edit, verified — in one
    session, without leaving the wizard to read documentation or set an environment variable.
  - >
    After exiting, the whole conversation is scrollable, searchable and selectable in the terminal
    the session ran in, using only the terminal's own facilities.
  - >
    A refusal in a real run names its rule and its layer on screen, and the same refusal is in the
    durable trace.
  - >
    The headless subcommand and the interactive session produce the same events for the same task,
    with no interface code on the headless path.
  - >
    A session driven entirely by keyboard in plain mode, with colour disabled, completes the same
    task as the default interface.
non_goals:
  - >
    An agent loop, a provider client, tools, a sandbox, a policy engine or a session store. That is
    io-harness, and duplicating it is the specific failure this product exists to avoid.
  - A daemon, a client/server split, or a second process of any kind.
  - A graphical interface — that is io-studio.
  - An alternate-screen or "fullscreen" rendering mode, behind any flag or environment variable.
  - Mouse-driven interaction as a primary input model.
  - OAuth and subscription authentication.
  - A plugin UI framework, a theme marketplace, or user-scriptable widgets.
  - Editor or IDE integration.
  - Hosting, telemetry collection, or any network call the operator did not ask for.
  - >
    Publishing to crates.io, and `cargo install` as an install path. The crate name `io-cli` is held
    by this owner and carries seventeen yanked versions, 0.1.0 through 0.14.0, from the archived
    product — a yank does not free a version number, so publishing would force the whole roadmap to
    restart above 0.14.0. Beyond that, `cargo install` requires a Rust toolchain on the user's
    machine and compiles io-harness from source, which is the slowest install path available for a
    terminal application. Decided 2026-08-16; see iterations/US-IO-CLI-0.1.0-I01.
  - >
    Homebrew, Scoop, WinGet, or any OS package manager. One script per platform is the whole
    distribution surface, and each additional channel is a manifest that goes stale.
mvp_boundary: >
  A developer with no prior configuration runs `io` in a repository, is walked through picking a
  provider, entering and verifying a key, choosing a model and a theme, types one real task, watches
  it stream and edit a file inside the sandbox, interrupts it with a keystroke, and exits — leaving
  the whole conversation in the terminal's own scrollback.
assumptions:
  - >
    io-harness 0.60.1 already provides everything this product renders: fifty run event kinds, the
    session layer with steering and forking, configuration discovery and layering, policy layers,
    sandbox, providers with pricing, and the durable store. This has been read from the source, not
    assumed — see `Session`, `Observer`/`RunEvent`, `Config` and `Policy` in that crate.
  - >
    The differentiator is that the core emits the permission boundary, the spend ceiling and the
    agent tree, and no competing core does. A 2026-08-16 audit of the terminal agent field found
    every other interface constrained to a chat log with tool cells for that reason.
  - >
    The hybrid inline renderer is achievable on the ratatui inline viewport with `insert_before`.
    This is how at least one shipped Rust agent renders and it is the reason its content survives in
    scrollback. **Unverified in our own code** — it is the single largest technical risk in the
    first release and is the first thing to be proven.
  - >
    Building the wizard on the product's own Picker overlay, rather than adopting a Rust prompt
    library, avoids a second raw-mode owner and a second aesthetic. The alternative — `inquire` is
    the strongest candidate — remains available if the overlay proves more expensive than expected.
  - >
    A `0600` configuration file is an acceptable credential store for the first releases. An
    OS-keychain backend is a later addition, and it is not obviously better: a keychain that fails
    silently on a headless Linux box is worse than a file that never does.
  - >
    Each initorigin repository runs its own UltraShip workspace. io-harness, io-studio, io-eval and
    the website are planned separately in their own repositories.
