known_limitations:
  - >
    **Spend against the tree ceiling is not in the status line, and the roadmap
    moved rather than this record pretending.** `EventKind::SpendDraw` is emitted
    only by a contained turn, and io-harness's contained entry point takes no
    steer inbox — rendering spend today would have cost `Ctrl+C`. It is the same
    harness boundary that already blocks the configuration's `[sandbox]` and
    `[run]` sections. Moved to 0.8.0, the fleet release, which is contained by
    definition. If a harness turn that is both contained and steerable appears
    sooner, it moves with it.
  - >
    **`rule` and `layer` are `None` in the ordinary case, not the exotic one.**
    Every question and every refusal in the live rehearsal came through unnamed,
    because the posture's own `write: Ask` default is what asks and no glob names
    the action. So `no rule named it: the tier default decided` is what most
    operators will see most of the time. That is accurate — io-harness is explicit
    that an unnamed action in the grey tier is the least vouched-for kind — but
    the sentence is long for a line that repeats, and a shorter form is worth
    designing once it has been read a hundred times.
  - >
    **The overlay shows a write's proposed content plainly, not as a diff.** The
    harness hands an approver the resulting file rather than a patch, so the diff
    is this product's to compute and 0.3.0's to design. In a four-row viewport the
    content gets one row, with the cut count riding its end.
  - >
    **The context field is quiet by design.** `Compacted` is the only event
    carrying an observation-section size, so between folds nothing on the stream
    knows it and the field is absent. The per-step estimate is durable in the
    store as `ContextEvent::est_tokens`; the upgrade path is one store read and is
    marked with a `ponytail:` comment where the field is declared.
  - >
    **`Decision::Defer` and `Decision::Approve { modified }` are unbound.**
    Deferring stops the run and persists the request, which is only useful
    alongside the resume that arrives in 0.4.0; approving a rewritten action is an
    editor inside an overlay. Both are real harness affordances, deliberately not
    half-built.
  - >
    **A question about intent is still a dead end.** `awaiting_answer` says so and
    points at the next prompt. Answering one needs a `Responder` on a
    caller-supplied contract, which is the same entry point that would cost
    `Ctrl+C`. 0.7.0.
  - >
    **The answers row has a double space after each separator**, because the
    two-cell selection marker sits after a spaced separator. Cosmetic, noticed
    during the F10 preview, and deliberately not changed while the owner's gate
    was in flight. A one-line fix for 0.2.1 or 0.3.0.
  - >
    **A turn commonly ends `Stalled` after its work succeeded.** Observed on every
    live run of this release — and identically on the never-asks path 0.1.0
    shipped, at the same step count on the same prompt. It is the model rather
    than the approval flow, and it is recorded here because an operator will see
    it and wonder.
  - >
    **`live_f1_a_real_turn_streams_and_edits_a_file` currently fails**, and this
    release did not cause it. It asserts the turn streamed assistant tokens; the
    model stalled without a closing message and streamed none. The test's own
    comment records that exact fragility. It is `#[ignore]`d, CI never runs it,
    and it belongs to 0.1.0's F1 — left alone rather than reworded into passing.
  - >
    **One low Dependabot advisory predates this release**: `lru`'s `IterMut`
    violates Stacked Borrows, reached through `ratatui 0.29`, which `Cargo.toml`
    pins deliberately because `tui-textarea 0.7` is built against exactly that
    pair. Moving off it means depending on somebody's fork of the one widget the
    composer is made of. A dependency release of its own.
  - >
    **The harness pin stays at 0.60.1 on purpose.** 0.60.2 and 0.60.3 are
    published and API-identical, so nothing here needs them, and moving the pin
    would have put an untested dependency change on a release that already changes
    the permission surface.
  - >
    **This record is sealed before the Release exists, which is the flow rather
    than a shortfall.** The sealed record and its lock pin ride `feat/0.2.0` and
    merge with the code, so the seal necessarily precedes the tag that cuts the
    Release. `mode: published` describes the channel this product has. The second
    half of O1 — CI green again on the merge to `develop` — and O4's four
    artifacts follow this point. If the tag or the matrix fails after it, the
    correction is a new version, not an edit.
