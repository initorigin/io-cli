  - id: US-IO-CLI-0.1.0-T18
    summary: Build the binary in release profile and run it, then record `cargo tree --depth 1` and the
      startup and streaming measurements as evidence.
    why_required: O2 is a standing gate because CI builds the test profile only and a release-profile
      break is invisible to it — this has broken a binary in this line of repositories before. N4
      requires the measurements to be recorded rather than asserted.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T14
      - US-IO-CLI-0.1.0-T17
    acceptance_criteria:
      - >
        **O2 — the binary builds in release profile.** `cargo build --release` is run and the binary
        executed. CI builds the test profile only, so a release-profile break is invisible to it —
        this has bitten this line of repositories before and is now a standing gate.
      - >
        **N4 — no timing assertion anywhere in this release's tests.** Startup cost and streaming
        smoothness are **recorded as measurements** in the release evidence, not gated. This line of
        repositories has paid for wall-clock assertions on CI runners more than for anything else.
    files:
      - README.md
      - docs/config.example.toml
    evidence:
      - "O2: cargo build --release exits 0 in 1m46s on rustc 1.95.0 aarch64-apple-darwin, and the
        binary RUNS. io --version prints 0.1.0, io --help prints the subcommand and both flags, and
        io with a non-tty stdout refuses with exit 1 and a sentence rather than half-working. CI
        builds the test profile only, so none of that is visible to it."
      - "N1: cargo tree --depth 1 is exactly the eight names the contract permits — io-harness
        0.60.1, ratatui 0.29.0, crossterm 0.28.1, tui-textarea 0.7.0, clap 4.6.6, tokio 1.53.1,
        serde 1.0.229, toml 1.1.4 — plus tempfile as a dev-dependency. Saved to the release
        evidence."
      - "N4 measurements, RECORDED and not gated: binary 20,236,832 bytes; startup 4.86 ms per run
        measured over fifty runs against a 1.64 ms process-spawn baseline, so io's own share is 3.22
        ms. THE FIRST VERSION OF THIS MEASUREMENT WAS WRONG and was discarded: it timed a python
        process start on either side of the binary and reported 26 ms, almost all of which was the
        harness. A misleading number is worse than no number."
      - "The business case, measured: 3,458 lines of source across 16 files and 3,102 lines of tests
        across 17, against the archived product's 1,199,453 lines across 88 crates. That ratio is
        the whole reason this release exists."
      - "A LIMITATION FOUND AND DOCUMENTED RATHER THAN LEFT TO SURPRISE SOMEBODY:
        Session::turn_steered builds its own TaskContract, and io-harness has no entry point that
        takes both a caller's contract and a steer inbox. So [sandbox] limits, [run] budgets,
        [instructions]/AGENTS.md, [[mcp]], [[lsp]], [[agent]], [web] and [browser] are read by the
        harness and NOT applied to an io-cli turn — honouring them today would mean giving up
        Ctrl+C, which F6 requires. The sandbox itself IS on: TaskContract::workspace sets
        exec_sandbox, so a workspace turn runs commands inside it; what is missing is the configured
        ceilings, not the containment. Stated in the README and in docs/config.example.toml. Nothing
        in the 0.1.0 contract promised those sections, so this is not a scope change — but it is the
        natural first item for a harness release, and the owner should decide whether it is."
  - id: US-IO-CLI-0.1.0-T19
    summary: "Run the live first run end to end against a real provider and record it: wizard, verified
      key, written file, streamed answer, sandboxed edit, interrupt, exit, then the terminal's own
      search and selection over the transcript."
    why_required: F1 is the release's only criterion that a fixture cannot prove, and the recording is
      both the release evidence and the README screenshot. The owner's approval of the rendered look
      is taken from it.
    status: in-progress
    depends_on:
      - US-IO-CLI-0.1.0-T18
    acceptance_criteria:
      - >
        **F1 — the live first run.** From an empty `$IO_CONFIG_HOME`, in a real repository, against
        a real provider: the wizard is completed, the key is verified by a live call, the file is
        written, a task is typed, the answer streams, a file is edited inside the sandbox, `Ctrl+C`
        interrupts a second turn mid-flight, and `Ctrl+D` exits. Afterwards, in the same terminal,
        the transcript is searched with the terminal's own search and a passage is selected with the
        mouse and pasted elsewhere. Manual, recorded, and the recording is the release evidence. A
        fixture cannot prove this; only a live run can.
    files:
      - tests/live.rs
      - tests/wizard.rs
      - src/term.rs
      - src/events.rs
      - src/wizard.rs
      - src/main.rs
      - tests/events.rs
      - scripts/f1-fixture.sh
    evidence:
      - "F1 PASSED, 2026-08-16, recorded. From an empty configuration: the wizard completed, the key
        was verified live, the file was written at mode 0600 carrying the model chosen from the live
        catalogue, a task streamed and EDITED THE FILE INSIDE THE SANDBOX — src/lib.rs went from 'a
        - b' to 'a + b' — a second turn was interrupted, and the session exited. The terminal's own
        search and selection worked on the transcript afterwards, because io-cli never took them
        away. Recording held by the owner."
      - "DEFECT 5, FOUND BY THE PASSING RUN: the theme step drew NO PICKER. render_theme reserved
        four rows for its live sample out of a four-row viewport, leaving zero for the picker, so
        the operator saw only the sample — which deliberately contains a refusal and a success so
        the palette can be judged — and read it as their own session failing. The same fixed
        four-row viewport showed only three rows of a four-hundred-model catalogue, because a picker
        draws height - 1."
      - The fix gives the WIZARD its own viewport, fourteen rows clamped to the terminal, separate
        from the session's four. The two phases are divided by a boundary where nothing is
        streaming, so re-placing the viewport there disturbs nothing in flight — which is what made
        the fixed-height constraint acceptable in the first place. The sample now opens with
        'preview — not your session:', because a label is what stops the two states worth judging
        from reading as alarm. Two tests; two sabotages, reserving the whole viewport again and
        removing the label, each fail exactly the new test.
      - F1 IS THE OWNER'S RUN AND IT HAS ALREADY EARNED ITS PLACE. The first attempt failed on the
        credential screen, three times in a row, before a single character was typed — and the
        defect it found is the worst kind this release could have shipped.
      - "DEFECT 3, FIRST CONTACT, FOUND BY F1: pasting the API key closed the wizard. The driver's
        wizard loop destructured the next event as Event::Key and returned Ok(None) on any other
        shape — and Cmd+V arrives as Event::Paste when bracketed paste is on, which this product
        enables. The pattern failed, the else branch ran, and the wizard exited. SILENTLY: that path
        returned before it could even commit its own 'nothing was written' notice, so a first-time
        user sees the splash, the welcome, the credential prompt, and then their shell prompt back
        with no explanation. A terminal resize mid-wizard did the same thing. And even once it
        stopped exiting, the wizard had no paste handling at all, so the key would have landed
        nowhere."
      - The session loop had always handled non-key events correctly; only the wizard was wrong —
        which is why no test caught it. Dispatch lived in the driver, and the driver is the one
        thing the suite cannot reach. The fix moves it into Wizard::event, in the library, where
        four tests now cover it.
      - "A paste is stripped of newlines rather than submitted: a key copied out of a web page
        usually carries a trailing one, and treating it as Enter would submit a field the user was
        still filling in."
      - "SABOTAGE — make a non-key event cancel again: only
        no_event_other_than_a_keypress_can_end_the_wizard fails. SABOTAGE — make the paste land
        nowhere: exactly the two paste tests fail. Together they pin both halves of the defect."
      - "DEFECT 4, FOUND BY THE OWNER'S SECOND F1 RUN: the 'ask before writes' posture dead-ended.
        Every write and exec needs an approver, this release passes DenyAll because the approval
        overlay is 0.2.0, and the agent was denied three times, then asked 'May I have approval to
        edit src/lib.rs' — and the turn ended awaiting_answer, an outcome io-cli had no arm for. It
        fell through the unknown-outcome branch and printed a bare 'error' with no explanation and
        no next action. The denials were honest and documented; the DEAD END was not. A wizard
        option led somewhere the interface could not get the operator out of."
      - "The fix keeps every posture honest without adding the 0.2.0 surface: awaiting_answer,
        awaiting_approval and awaiting_plan now read as warnings rather than errors — nothing went
        wrong, the run simply cannot continue — and each carries a sentence naming the way out,
        which for all three is `io setup` and the sandboxed-workspace posture. A refusal says the
        same. Two tests, and two sabotages: dropping the tone arm and emptying the help each fail
        exactly the two new tests."
      - "A process note from the same fix: cargo fmt had already split the match arm across lines,
        so an exact-string patch silently did nothing and the code was unchanged while the edit
        reported success. The test caught it. Patching formatted source by string match is only safe
        when a test is watching."
      - "WHAT WAS PROVED LIVE BEFORE THIS, and still holds: a real key accepted by the wizard's
        verification call; F3 live, a wrong key rejected carrying OpenRouter's own words (HTTP 401,
        'User not found.'); 413 models in the catalogue; and a real turn through the real bridge and
        renderer that streamed 45 events and edited a file inside the sandbox."
      - "DEFECT 1, N2: Screen::attach enabled raw mode and could then return Err without restoring,
        leaving the shell with no echo and an error that did not say what had happened. Every
        failure path after raw mode now restores first."
      - "DEFECT 2, USER-FACING: every ordinary successful turn printed the word 'warning', because
        io-harness returns 'finished' rather than 'success' for a turn with no verification
        criterion — and every io-cli turn is exactly that, so 'success' is unreachable from this
        interface. Invisible to a green suite; found by running one live."
      - "STILL THE OWNER'S, and unchanged: the recorded run itself, the terminal's own search and
        selection over the transcript afterwards, and approval of the rendered look. 96 tests green
        and clippy clean against the tree carrying all three fixes."
