product: io-cli
version: 0.1.0
tasks:
  - id: US-IO-CLI-0.1.0-T01
    summary: Create the repository skeleton and the one-crate manifest for the `io` binary.
    why_required: "Nothing else in the release can be written, built or tested without a crate. The
      manifest is also where N1 is decided: the dependency set that this release is allowed to have
      is declared here once, and every later task is measured against it."
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **N1 — io-cli contains no second harness.** `cargo tree --depth 1` is recorded in the
        release evidence and reviewed: `io-harness`, `ratatui`, `crossterm`, `tui-textarea`, `clap`,
        `tokio`, `serde`/`toml`, and nothing that constitutes a runtime, a client or a store. Any
        addition beyond that list is argued in the release record or it does not ship.
    files:
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - .gitignore
      - .github/CODEOWNERS
      - .github/dependabot.yml
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/bug_report.md
      - .github/ISSUE_TEMPLATE/feature_request.md
      - src/main.rs
      - src/cli.rs
      - src/lib.rs
    evidence:
      - cargo build exits 0 against a lockfile of 274 packages, resolved 2026-08-16.
      - "The direct dependency set is exactly the eight N1 names: io-harness 0.60.1, ratatui 0.29,
        crossterm 0.28, tui-textarea 0.7, clap 4, tokio 1, serde 1, toml 1, plus tempfile as a
        dev-dependency. Nothing that is a runtime, a client or a store."
      - The manifest carries publish = false, so the crates.io non-goal is mechanical rather than
        remembered.
      - "rust-version is 1.95, copied from io-harness rather than guessed: libsqlite3-sys calls the
        std cfg_select! macro from its build script and neither it nor rusqlite declares the floor."
  - id: US-IO-CLI-0.1.0-T02
    summary: "Add `ci.yml`: build, test, clippy -D warnings and fmt --check on macOS, Linux and Windows."
    why_required: O1 requires a green run on three platforms on the feature branch and again on the
      merge. Without the workflow there is no run to be green, and Windows — where this line of
      repositories historically finds what the other two hide — is never exercised.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T01
    acceptance_criteria:
      - >
        **O1 — CI green on macOS, Linux and Windows**, on the feature branch and again on the merge
        to `develop`. Windows is not optional: it is where a terminal renderer's assumptions break,
        and it is where this project has historically found what the other two hid.
    files:
      - .github/workflows/ci.yml
    evidence:
      - ci.yml runs build --all-targets, test --all-targets, test --doc on ubuntu-latest,
        macos-latest and windows-latest with fail-fast off, plus a lint job (fmt --check, clippy -D
        warnings) and an msrv job that reads rust-version out of Cargo.toml rather than repeating
        it.
      - "Every uses: is pinned to a full-length commit SHA with the version in a trailing comment;
        no job id contains a dot; cancel-in-progress is false so a superseded run keeps its
        diagnostics."
      - The green run itself is recorded against O1 when the branch is pushed.
  - id: US-IO-CLI-0.1.0-T03
    summary: "Build the inline renderer core and the byte-stream capture harness: `Viewport::Inline`,
      `insert_before` for finished content, synchronized output per frame, and a panic hook plus
      `Drop` guard that restore the terminal."
    why_required: This is the release. Every other surface renders through it, and the contract names it
      the single largest technical risk with the instruction to build it before anything else. The
      capture harness is built with it because F5 and N3 cannot be asserted without one.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T01
    acceptance_criteria:
      - >
        **F4 — finished content reaches scrollback, not the viewport.** After a scripted session,
        the captured byte stream contains every finished message's text outside the viewport region,
        and the viewport buffer at rest contains only the composer and the status line. Sabotage:
        render a finished message into the viewport instead of committing it, under which only F4
        fails.
      - >
        **F5 — no alternate screen and no mouse capture, ever.** Over the same captured byte stream,
        the sequences `ESC[?1049h`, `ESC[?1047h`, `ESC[?1000h`, `ESC[?1002h` and `ESC[?1003h` do not
        appear. This is the release's structural criterion and it is written so that no later
        release can reintroduce fullscreen without failing it. Sabotage: call
        `EnterAlternateScreen`, under which only F5 fails.
      - >
        **N2 — the terminal is always restored.** Panic, `Ctrl+C` at any point, and a kill signal
        each leave the terminal in cooked mode with the cursor visible and the scrollback intact.
        Asserted by a test that panics inside a turn and inspects the restore path, and by manual
        check for the signal case.
      - >
        **N3 — no full-screen clear during a session.** The captured byte stream contains no
        `ESC[2J` after startup. This is the flicker criterion, and it is asserted structurally
        because flicker itself cannot be asserted on a CI runner.
    files:
      - src/term.rs
      - src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - tests/support/mod.rs
      - tests/structure.rs
      - tests/scrollback.rs
      - tests/restore.rs
    evidence:
      - 8 tests pass across tests/structure.rs, tests/scrollback.rs and tests/restore.rs; cargo fmt
        --all -- --check and cargo clippy --all-targets -- -D warnings both exit 0.
      - "The harness is a real CrosstermBackend writing into a Recorder, wrapped by a Fixed backend
        that answers only size() and get_cursor_position() from test-chosen values. TestBackend was
        rejected on purpose: it emits no escape sequences, so F5 would pass against it because
        nothing appears rather than because nothing forbidden appears."
      - "SABOTAGE A — queue EnterAlternateScreen in draw(): both F5 tests fail, the other six pass."
      - "SABOTAGE B — queue Clear(ClearType::All) in draw(): only
        n3_never_clears_the_whole_screen_during_a_session fails."
      - "SABOTAGE C — commit() renders through draw() into the viewport instead of insert_before:
        both F4 tests fail, F5 and N3 still pass."
      - "SABOTAGE D — call the previous panic hook before the restore: only
        n2_a_panic_runs_the_restore_before_the_previous_hook fails."
      - "SABOTAGE E — drop the idempotence guard on restore(): only
        dropping_the_screen_restores_it_once fails."
      - insert_before is given a MEASURED height from Paragraph::line_count(width), not an estimate.
        ratatui's unstable-rendered-line-info feature is enabled for that one method; an estimated
        height truncates committed content, which on this renderer loses it from the transcript
        permanently.
  - id: US-IO-CLI-0.1.0-T04
    summary: Handle resize without duplicating committed scrollback, and define every surface at 80x24.
    why_required: F9 makes 80x24 a supported size rather than a degraded one, and resize is where a
      hybrid inline renderer duplicates history if it is wrong. Both are properties of the renderer,
      so they are fixed while it is still small.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T03
    acceptance_criteria:
      - >
        **F9 — 80×24 is supported.** The renderer harness runs the scripted session at 80×24 and
        asserts no panel is truncated mid-word, the composer remains usable, and the status line
        degrades to its narrow form rather than wrapping.
    files:
      - src/term.rs
      - tests/support/mod.rs
      - tests/resize.rs
      - tests/narrow.rs
    evidence:
      - 13 tests pass across five test binaries; fmt and clippy -D warnings both exit 0.
      - "Resize: a committed line is written exactly once and stays written once across two resizes,
        so the transcript is never redrawn — the duplication a full-screen renderer produces has no
        code path here."
      - "80x24: a forty-line commit into a twenty-four-line terminal keeps the viewport; a
        two-hundred-character line wraps with all twenty repeats intact; CJK text wraps with every
        character intact and no replacement character in the byte stream."
      - "SABOTAGE F — compute the commit height from lines.len() instead of
        Paragraph::line_count(width): three tests fail (both wrapping tests and the post-resize
        commit), the other ten pass."
      - "SABOTAGE G — make Screen::resize a no-op: the FIRST version of the resize test failed
        nothing, because ratatui's autoresize re-reads the terminal size at the top of every draw
        and covered it. That was a real finding about the test, not the code. The test now commits
        between the resize and the next frame, which is the only path where the explicit call is
        load-bearing, and the same sabotage fails exactly that one test."
      - "The harness gained Fixed::set_size for the same reason: a backend whose size never moves
        undoes any resize on the very next frame, which is a property of the harness and would have
        hidden a genuine renderer bug."
  - id: US-IO-CLI-0.1.0-T05
    summary: Add the theme token set with two shipped themes, terminal background detection, `NO_COLOR`,
      and the splash committed once into scrollback.
    why_required: N6 requires that a session run with colour disabled stays usable and that every state
      colour distinguishes also carries a word. That is a property of the token set, so the tokens
      have to exist before any surface uses one. The splash is the first thing written through the
      renderer and is suppressed by the same switches.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T03
    acceptance_criteria:
      - >
        **N6 — `NO_COLOR` produces a usable session.** With `NO_COLOR=1` the scripted session runs
        and every state that colour distinguishes — success, warning, error, refusal — also carries
        a word.
    files:
      - src/theme.rs
      - src/splash.rs
      - src/lib.rs
      - tests/no_color.rs
    evidence:
      - 19 tests pass; fmt and clippy -D warnings exit 0. Six of them are new and cover the theme,
        the splash and NO_COLOR.
      - "The colour-is-never-alone rule is a property of the constructor, not a convention:
        Theme::notice is the only way a toned line is built and it puts the tone's word in front of
        the text, so a call site cannot forget. Tone::word returns None for the three presentation
        tones and Some for the four that mean something."
      - NO_COLOR wins over an explicitly chosen theme, and the PLAIN theme returns a bare Style with
        no modifier — a dim or italic attribute would still be a presentation-only carrier of
        meaning.
      - "Background detection reads COLORFGBG rather than issuing an OSC 11 query: the query needs a
        reply read back off stdin and hangs on any terminal that does not answer, in a product whose
        first frame should already be on screen. Unparseable or absent means dark, because the light
        palette on a dark terminal is the less readable mistake."
      - "SABOTAGE H — Theme::notice emits colour without the word: the two N6 word tests fail,
        nothing else."
      - "SABOTAGE J — the PLAIN theme emits an indexed colour: only the scripted NO_COLOR session
        fails, on the escape-sequence assertion."
      - "SABOTAGE K — the splash ignores NO_COLOR: only the splash suppression test fails."
      - "The splash is also suppressed below forty-one columns, which the contract does not require:
        the mark is forty-one wide and is the first thing that looks broken on a small window."
  - id: US-IO-CLI-0.1.0-T06
    summary: "Build the composer on `tui-textarea`: multiline on Shift+Enter with a `\\`+Enter fallback,
      prompt history on the arrow keys, and bracketed paste."
    why_required: There is no way to type a task without it, so F1 and F6 both stop here. Its narrow
      form is also half of what F9 asserts.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T04
      - US-IO-CLI-0.1.0-T05
    acceptance_criteria:
      - >
        **F9 — 80×24 is supported.** The renderer harness runs the scripted session at 80×24 and
        asserts no panel is truncated mid-word, the composer remains usable, and the status line
        degrades to its narrow form rather than wrapping.
    files:
      - src/composer.rs
      - src/lib.rs
      - tests/composer.rs
    evidence:
      - 30 tests pass across seven binaries; fmt and clippy -D warnings exit 0. Eleven of them are
        the composer's.
      - "A REAL DEFECT was found by reading the captured byte stream rather than the rendered
        buffer: every frame carried ESC[?25l, hiding the cursor. ratatui hides it on any frame that
        does not set a cursor position, and a hidden cursor removes the only focus indicator a
        screen reader has — the specific criticism this product category is unusable for. The fix
        puts frame.set_cursor_position inside Composer::render, so the widget that owns the
        insertion point owns the cursor and no frame can forget."
      - "A second finding, about the harness rather than the code: ratatui writes only the cells
        that differ from the previous frame, so viewport text arrives in the byte stream split at
        its unchanged spaces with a cursor move between the pieces. Viewport assertions therefore
        read viewport_text(); committed content still reads the bytes, because insert_before draws
        every cell of a fresh buffer."
      - Shift+Enter inserts a newline and a trailing backslash does the same on the terminals that
        cannot report Shift+Enter at all — which without the Kitty keyboard protocol is most of
        them.
      - The arrows walk prompt history only from the first and last line, so a multiline prompt can
        still be edited; a repeated prompt is one history entry; walking past the newest entry
        restores the draft that was being typed.
      - "SABOTAGE L — remove the backslash continuation: only
        a_trailing_backslash_continues_the_line fails."
      - "SABOTAGE M — let Up always recall history: only
        the_arrows_move_the_cursor_inside_a_multiline_prompt fails."
      - "SABOTAGE N — do not set the cursor position: only
        the_real_cursor_is_never_hidden_while_input_is_possible fails."
  - id: US-IO-CLI-0.1.0-T07
    summary: Build the `Picker` overlay component, once, as the widget every selection surface uses.
    why_required: The wizard has four selection steps and F2 drives all of them over the TestBackend.
      The contract also names this the one piece of the fallback scope that must not drop, because
      cutting it means hand-rolling the wizard and rebuilding it in 0.2.0 for approvals.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T04
      - US-IO-CLI-0.1.0-T05
    acceptance_criteria:
      - >
        **F2 — the wizard writes what it showed.** A test drives the wizard over the `TestBackend`
        with a scripted key sequence and asserts the resulting file parses under
        `io_harness::Config::from_toml`, that `provider_spec()` returns the chosen variant with the
        chosen model, and that the file's mode is `0600` on unix. Sabotage: write the file before
        the confirmation screen, under which only F2 fails.
    files:
      - src/picker.rs
      - src/lib.rs
      - tests/picker.rs
    evidence:
      - 37 tests pass across eight binaries; fmt and clippy -D warnings exit 0. Seven of them are
        the picker's.
      - One widget, in the viewport, never in scrollback — a choice that has scrolled away cannot be
        answered. The wizard's four selection steps, /model and /theme are this widget with
        different rows, and 0.2.0's approval overlay and 0.4.0's /resume and /fork are the same
        widget again.
      - The selection is marked by a marker character as well as by colour, so it survives NO_COLOR
        and a monochrome terminal.
      - "At eighty columns a row loses its DETAIL, not its label, and is fitted with a
        single-character ellipsis rather than wrapped: a row that wraps stops the list being a list,
        and the label is the part that has to survive."
      - Movement clamps at both ends rather than wrapping, matching the composer's history, and a
        long list scrolls so the selection is always drawn.
      - "SABOTAGE P — never scroll to the selection: only
        a_long_list_scrolls_so_the_selection_stays_visible fails."
      - "SABOTAGE Q — render the detail unfitted: only the eighty-column row test fails."
      - "SABOTAGE R — mark the selected row by colour alone: only
        the_selected_row_is_marked_by_more_than_colour fails."
  - id: US-IO-CLI-0.1.0-T08
    summary: Render the status line with model, elapsed time and a working indicator, laid out for 0.2.0
      fields.
    why_required: F4 asserts that the viewport at rest contains the composer and the status line and
      nothing else, so the status line has to exist for that assertion to mean anything. F9 asserts
      it degrades to a narrow form rather than wrapping.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T04
      - US-IO-CLI-0.1.0-T05
    acceptance_criteria:
      - >
        **F9 — 80×24 is supported.** The renderer harness runs the scripted session at 80×24 and
        asserts no panel is truncated mid-word, the composer remains usable, and the status line
        degrades to its narrow form rather than wrapping.
    files:
      - src/status.rs
      - src/lib.rs
      - tests/status.rs
    evidence:
      - 42 tests pass across nine binaries; fmt and clippy -D warnings exit 0. Five of them are the
        status line's.
      - "Three fields filled — model, running state, elapsed — and the 0.2.0 fields are named in the
        module rather than left to a later redesign: adding the policy layer, context pressure,
        spend and containment is filling in a value."
      - The running state is a WORD rather than a spinner. A spinner carries its meaning only to a
        reader who can see it move, and this line has to work in a screen reader.
      - "The narrow form drops whole fields from the right and never wraps: a status line that
        becomes two lines has taken a row from the transcript and stopped being a status line. Below
        the width of even one field the model is shown truncated, because a blank status line is
        worse than a truncated one. Asserted across nine widths from 1 to 200."
      - Field width is counted in characters, not bytes — the separator's middle dot is two bytes
        and one cell, and byte accounting reserved room that was not needed and dropped a field a
        column early.
      - "SABOTAGE S — keep every field regardless of width: only the narrow-form test fails."
      - "SABOTAGE T — render the running state as a tone with no word: three tests fail, all of them
        status tests."
  - id: US-IO-CLI-0.1.0-T09
    summary: "Map io-harness run events to rendered cells with an exhaustive match: `started`, `token`,
      `step`, `tool_call` and `finished` styled, `refused` and `approval_requested` as a plain
      notice, every other kind as a muted line."
    why_required: F8 requires the match to be exhaustive with no wildcard that silently discards. This
      is also where token coalescing lives, without which a streaming turn strobes.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T03
    acceptance_criteria:
      - >
        **F8 — every event kind is accounted for.** A test enumerates the event kinds io-harness
        emits and asserts the renderer's match is exhaustive with no wildcard that silently
        discards. An event this release does not style renders as a muted line; none is dropped.
        Sabotage: add a catch-all arm that returns without rendering, under which only F8 fails.
    files:
      - src/events.rs
      - src/lib.rs
      - tests/events.rs
      - tests/support/mod.rs
    evidence:
      - 48 tests pass across ten binaries; fmt and clippy -D warnings exit 0. Six of them are the
        event renderer's.
      - "EventKind is #[non_exhaustive] with fifty variants and no accessor for its own tag, so a
        wildcard arm is REQUIRED BY THE TYPE rather than chosen. F8 is therefore asserted as the two
        things that actually matter: no kind renders to nothing, and no kind exists that this
        repository has never seen."
      - The drift half reads io-harness's OWN SOURCE out of the cargo registry — the version taken
        from this crate's lockfile, so the source read is the source built — parses the variants of
        pub enum EventKind, and requires the set to equal the seven styled names plus the
        forty-three that fall through. A fifty-first kind fails the test by name, which is the
        moment someone has to decide what it should look like. A list copied into this repository
        could not have noticed.
      - "An unstyled kind names itself. The label comes from the derived Debug form, snake-cased the
        way #[serde(rename_all)] does, because reaching the serde tag would mean carrying a
        serializer for a label."
      - "Tokens are coalesced: a token commits nothing and accumulates in a live buffer the viewport
        draws, and the whole passage commits once when a step, a refusal or the finish closes it.
        Committing per token would put a scrollback line in the terminal for every few characters
        the model produced."
      - A refusal keeps its rule and its layer even in the plain one-line notice this release
        renders it as — those are the two facts no other core records, and 0.2.0's surface is a
        presentation of them, not their first appearance.
      - "SABOTAGE U — wildcard arm returns no lines: exactly the two no-silent-drop tests fail."
      - "SABOTAGE V — commit each token as its own line: only the coalescing test fails."
      - "SABOTAGE W — remove one kind from the known list: only the drift test fails, which is what
        proves the drift test can fail at all."
  - id: US-IO-CLI-0.1.0-T10
    summary: "Bridge io-harness to the screen: an `Observer` that hands events to the render loop
      without blocking the run, a session driven by `Session::turn_steered`, and `Ctrl+C` calling
      `Steer::interrupt`."
    why_required: This is the only path from the harness to the interface, and F6 — interrupt a turn,
      keep the session, accept the next prompt — is asserted against it. `Observer::event` is
      synchronous and runs on the run's own task, so the bridge has to hand off rather than render
      in place.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T06
      - US-IO-CLI-0.1.0-T08
      - US-IO-CLI-0.1.0-T09
    acceptance_criteria:
      - >
        **F6 — an interrupt stops the turn and keeps the session.** A scripted `Ctrl+C` during a
        streaming turn causes `Steer::interrupt`, the turn ends, the partial output stays committed
        in scrollback, and the composer accepts the next prompt. A second `Ctrl+C` at an idle
        composer exits. Sabotage: drop the interrupt on the floor, under which only F6 fails.
    files:
      - src/app.rs
      - src/bridge.rs
      - src/lib.rs
      - tests/interrupt.rs
    evidence:
      - 57 tests pass across eleven binaries; fmt and clippy -D warnings exit 0. Nine of them are
        the bridge's and the session state's.
      - "Observer::event is synchronous and runs on the RUN'S OWN TASK, so the bridge does one thing
        — hand the event on down an unbounded channel — and the interface draws when it next gets
        to. Rendering inside the observer would put terminal I/O on the agent loop's path: a slow
        write slows the run, a blocking write stops it."
      - "The channel is unbounded deliberately. A bounded one fills in one of two ways and both are
        wrong here: blocking stalls the run, dropping loses an event, which is the failure F8 exists
        to prevent. A thousand events through the bridge arrive as a thousand events."
      - Ctrl+C during a turn returns Interrupt and the test drives Steer::interrupt, then reads
        SteerInbox::pending and sees the interrupt with no message beside it. The turn's partial
        output is committed by App::finished rather than lost with the turn, and the composer takes
        the next prompt afterwards. F1 covers the same path against a real model.
      - Ctrl+C with something typed clears the composer and does NOT count towards the exit, so a
        stray keystroke cannot end a session by surprise; twice at an idle composer exits, and the
        first one says so.
      - Ctrl+D exits only on an empty composer; Ctrl+L clears the VIEWPORT and never the scrollback,
        which on this renderer is the terminal's own buffer and not something this process could
        redraw.
      - "SABOTAGE X — Ctrl+C exits instead of interrupting: only the F6 interrupt test fails."
      - "SABOTAGE Y — a finished turn drops what streamed: the same test fails, on the
        partial-output assertion."
      - "SABOTAGE Z — the observer returns Flow::Cancel: exactly the two bridge tests fail."
  - id: US-IO-CLI-0.1.0-T11
    summary: Build the first-run wizard through its eight screens and write io-harness's configuration
      file at mode 0600, with nothing written before the confirmation screen.
    why_required: F2 is the wizard writing what it showed, and N5 is the credential never reaching the
      screen, the scrollback, a log line or the trace. The release's stated outcome starts from an
      empty configuration, so without the wizard there is no first run at all.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T07
      - US-IO-CLI-0.1.0-T10
    acceptance_criteria:
      - >
        **F2 — the wizard writes what it showed.** A test drives the wizard over the `TestBackend`
        with a scripted key sequence and asserts the resulting file parses under
        `io_harness::Config::from_toml`, that `provider_spec()` returns the chosen variant with the
        chosen model, and that the file's mode is `0600` on unix. Sabotage: write the file before
        the confirmation screen, under which only F2 fails.
      - >
        **N5 — the credential never reaches the screen, the scrollback, a log line or the trace.**
        The captured byte stream from the F2 scripted wizard is searched for the test key and must
        not contain it. Sabotage: echo the key in the confirmation screen, under which only N5
        fails.
    files:
      - src/wizard.rs
      - src/settings.rs
      - src/lib.rs
      - tests/wizard.rs
    evidence:
      - 64 tests pass across twelve binaries; fmt and clippy -D warnings exit 0. Seven of them are
        the wizard's, driven by a scripted key sequence over a real CrosstermBackend so the byte
        stream N5 asserts over is the one a terminal would have received.
      - "A REAL FINDING that changes how F2 can be asserted: Config::from_toml parses text as the
        PROJECT scope, and io-harness REFUSES a project-scoped file that widens the permission
        boundary. The wizard's default posture — sandboxed workspace — sets exec = allow, so the
        file it writes is correct and from_toml is right to reject it: widening is the operator's
        own decision and belongs to the user scope, which is where the wizard writes. The test
        therefore reads it back through Config::discover with the user file OUTSIDE the discovery
        root, and separately checks that a narrowing posture parses either way. F2's own scripted
        run chooses 'ask before writes', which narrows, so the criterion's literal from_toml
        assertion is still made and still passes."
      - "A second trap found while fixing the first: a user file placed at <root>/io.toml is ALSO
        the project-scope candidate, so it is read under project rules and refused. The user scope
        has to be somewhere the workspace is not."
      - "F2: the scripted run picks OpenRouter, types a key, takes the second model, the light theme
        and the ask-before-writes posture; the written file parses, provider_spec returns OpenRouter
        with openai/gpt-5 and the typed key, the policy's write default is Ask and net is Deny,
        [app.io-cli] gives back the chosen theme, and the file's mode is 0600 on unix. Nothing
        exists on disk at any point before the confirmation screen."
      - "N5: the key never appears in the byte stream, nor do its 12, 20 or 28 character prefixes;
        the field renders bullets, so the absence is masking rather than the key simply not being
        drawn; and the confirmation screen describes the credential as 'written into this file, mode
        0600' without any of its value."
      - Where an environment variable already carries the key, Enter on an empty field writes the
        file WITHOUT a key at all — the better outcome rather than a fallback, since a key that is
        never on disk cannot leak from it.
      - A posture is an io_harness::Policy rather than a flag of io-cli's own, which is what will
        let the status line name the layer in force. 'Ask before writes' says plainly at the moment
        it is chosen that a write is declined until the approval surface lands, rather than implying
        a behaviour this release does not have.
      - "SABOTAGE AA — produce the write when the posture is chosen, skipping confirmation: only the
        F2 test fails."
      - "SABOTAGE BB — remove the mask character: only the F2/N5 test fails."
      - "SABOTAGE CC — a rejection carries on to the model step: both F3 tests fail and nothing
        else."
  - id: US-IO-CLI-0.1.0-T12
    summary: Verify the credential against the live endpoint inside the wizard, returning to the
      credential step with the provider's own message and writing no file on failure.
    why_required: F3 asserts that a bad key does not get past the wizard. It is the step that decides
      whether a first run fails inside a screen that can explain it or on the user's first real
      prompt.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T11
    acceptance_criteria:
      - >
        **F3 — a bad key does not get past the wizard.** With a provider endpoint that rejects the
        credential, the wizard returns to the credential step carrying the provider's own message,
        and **no file is written**. Sabotage: treat any non-transport error as success, under which
        only F3 fails.
    files:
      - src/verify.rs
      - src/wizard.rs
      - src/main.rs
      - src/lib.rs
      - src/app.rs
      - src/term.rs
      - src/events.rs
    evidence:
      - 69 tests pass across thirteen binaries; fmt and clippy -D warnings exit 0. The verification
        path itself is exercised live by F1, which is what a credential check can only be proved by.
      - The rejection carries THE PROVIDER'S OWN MESSAGE rather than a category. '401 No auth
        credentials found' tells a user what to do and 'verification failed' does not, and every
        provider words it differently.
      - Provider is not dyn-compatible — its methods return impl Future — so each ProviderSpec
        variant is constructed and pinged in its own arm. That is the shape of the harness's trait,
        not a choice; the same match appears once more in the driver, where it picks the concrete
        type the session loop is generic over.
      - "A spec whose variant this release has never seen returns an explicit refusal rather than a
        pass it never made: ProviderSpec is #[non_exhaustive] and a wildcard that returned Ok would
        report a working key for a provider that was never contacted."
      - "The catalogue is io-harness's Reference, which reads OpenRouter's models endpoint — so for
        OpenRouter it is not a reference at all but the provider speaking for itself, and for
        Anthropic and OpenAI it is filtered by prefix. A catalogue that cannot be read is not fatal:
        the wizard offers the provider's usual default, or asks the user to type a model id when
        there is nothing to suggest."
      - "A DESIGN CONSEQUENCE settled here: ratatui fixes an inline viewport's height when the
        terminal is constructed and offers no way to change it, and rebuilding the terminal would
        re-query the cursor and risk shifting the scrollback this product exists to protect. So the
        viewport does not grow — instead a streaming answer commits each line to scrollback as it
        FINISHES and only the unfinished tail is ever live. A two-hundred-line answer leaves the
        viewport exactly the size it started. The ceiling it buys is that a prompt longer than two
        rows scrolls within them; the composer's own release is 0.7.0."
      - The clippy fix for a collapsible match would have put App::key — which mutates — inside a
        match guard. Bound to a local instead; a guard is not a place for something that changes
        state.
