  - id: US-IO-CLI-0.1.0-T10
    summary: "Bridge io-harness to the screen: an `Observer` that hands events to the render loop
      without blocking the run, a session driven by `Session::turn_steered`, and `Ctrl+C` calling
      `Steer::interrupt`."
    why_required: This is the only path from the harness to the interface, and F6 — interrupt a turn,
      keep the session, accept the next prompt — is asserted against it. `Observer::event` is
      synchronous and runs on the run's own task, so the bridge has to hand off rather than render
      in place.
    status: todo
    depends_on:
      - US-IO-CLI-0.1.0-T06
      - US-IO-CLI-0.1.0-T08
      - US-IO-CLI-0.1.0-T09
    acceptance_criteria:
      - >
        **F6 — an interrupt stops the turn and keeps the session.** A scripted `Ctrl+C` during a
        streaming turn causes `Steer::interrupt`, the turn ends, the partial output stays committed
        in scrollback, and the composer accepts the next prompt. A second `Ctrl+C` at an idle
        composer exits. Sabotage: drop the interrupt on the floor, under which only F6 fails.
    files:
