product: io-cli
version: 0.2.0
tasks:
  - id: US-IO-CLI-0.2.0-T01
    summary: Build the approver seam — a request out, a decision back, and a denial when nobody answers.
    why_required: "Every other task in this release renders or answers an approval, and none of them
      can exist until an approval can reach the interface at all. It is also the one place the
      product can deadlock: the approver runs on the agent's own task, so the release is not correct
      unless a dropped answer denies rather than blocks."
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F4 — an unanswered request denies rather than hangs.** Dropping the
        interface end of the answer channel resolves the request as a denial. No
        clock, no timeout, no sleep: the assertion is on what the approver returns
        when the channel is closed. Sabotage: block on the receiver, under which only
        F4 fails — and it fails by never finishing, which is why the arm is run under
        the suite's own harness rather than by hand.
    files:
      - src/approval.rs
      - src/lib.rs
      - tests/approval.rs
    evidence:
      - "`Asker` is the approver and `Ask` is the question, with the way back inside it. Answering
        consumes the `Ask`, so there is no way to answer twice and no way to hold one open by
        accident — dropping it *is* the denial, which makes F4's behaviour a property of the type
        rather than a rule somebody has to remember."
      - "`cargo test --test approval` — 4 passed, 0 failed. Two of them are the denial: one drops the
        whole receiver (the interface is gone), one takes the question and drops it (the interface
        went away mid-question). No clock, no timeout, no sleep anywhere in the file."
      - "Sabotage A2 — the unanswered path approves instead of denying: 2 failed, and they are
        exactly the two denial tests. The other two passed, so the arm failed only its own criterion."
      - "Sabotage A3, the arm the contract names — block on the receiver (`std::future::pending()`
        on a closed channel): the suite never finished and had to be killed by a watchdog at 45
        seconds. It fails by not terminating, which is what a deadlock looks like and why the
        watchdog is in the shell rather than in a test. N1 is untouched: no test measures anything."
      - "Sabotage A1 was a finding rather than a failure. An early return on `send` error was
        written first; removing it failed no test, because a failed `send` returns the `Ask` and
        drops it, which closes the oneshot inside it — so both ways of losing the interface already
        arrive at one `unwrap_or_else`. The branch was a second spelling of the same line and was
        deleted, with the reasoning left in a comment where the next reader will look for it."
      - "The question carries what the overlay needs: act, target, content, rule, layer and goal. A
        fourth test asserts each, because `EventKind::ApprovalRequested` carries only act and target
        — if the rule and the layer do not arrive on this seam they cannot be rendered at all."
      - "`cargo fmt --all -- --check` exit 0; `cargo clippy --all-targets -- -D warnings` exit 0;
        `cargo test --test timing --test dependencies` — 9 passed, so the new test file neither
        sleeps nor reads a clock, and the eight-name dependency set is unchanged."

  - id: US-IO-CLI-0.2.0-T02
    summary: Render the question as a viewport overlay that commits nothing to scrollback.
    why_required: "An approval that is committed to history can be scrolled away from a run that is
      blocked on it, which is the failure the overlay exists to prevent. This is the structural
      property the whole surface rests on."
    status: done
    depends_on:
      - US-IO-CLI-0.2.0-T01
    acceptance_criteria:
      - >
        **F1 — an approval request opens an overlay and commits nothing to
        history.** With a request delivered, the viewport holds the question and the
        scrollback gains nothing at all. Sabotage: render the request as a committed
        line, under which only F1 fails. This is the structural property the whole
        surface rests on — a question in the scrollback is a question that can be
        scrolled away from a run that is blocked on it.
      - >
        **F2 — the overlay states the act, then the target, then the rule and the
        layer, in that order.** Asserted over the positions of the facts in the
        rendered lines, never over their presence. Sabotage: put the rule first,
        under which only F2 fails.
    files:
      - src/approval.rs
      - src/picker.rs
      - src/app.rs
      - tests/approval.rs
    evidence:
      - "`Approval` owns the `Ask`, so the run stays paused for exactly as long as the overlay
        exists and not one moment longer. `App::finished` drops it, which denies — the run it
        belonged to has already ended, so there is nobody left to tell."
      - "`cargo test --test approval` — 8 passed, 0 failed. F1 asserts twice: nothing is queued for
        scrollback while a question is open, and the recorder's byte stream carries no committed
        line for it either. F2 asserts by position, with a closure that looks up each fact's index
        and compares them; a `contains` assertion would pass with the sentence inside out."
      - "Sabotage F1 — commit a line when the question opens: 1 failed, and it is F1's test alone.
        Sabotage F2 — move the rule and the layer to the front of the line: 1 failed, and it is F2's
        ordering test alone. Neither arm touched the other's test, and the tier-default test stayed
        green under both."
      - "**The answers are one row, not a vertical `Picker` list, and the contract's scope sentence
        assumed the latter.** A session viewport is four rows and ratatui fixes it at construction.
        Title plus three list rows fills all four and leaves nothing for the target, the rule, the
        layer or the content — the facts the overlay exists to show. So the layout is: the question
        on row one, the proposed content in the rows between, and `› y allow once · a allow this
        session · n deny` on the last. Nothing the contract promised was dropped; the overlay shows
        strictly more than a picker could have. It still reads as one product: the same `›` marker,
        the same ` · ` separator, the same `Tone` palette, and `picker::fit` — now public — is the
        one fitting rule for a shortened path, a shortened row and a shortened line of content."
      - "The content preview says what it cut (`⋯ 37 more lines`). A reader who believes they have
        seen a whole file and has seen four lines of it is worse off than one who was told, and this
        is the surface where that belief authorises a write."
      - "The tier-default case is rendered as a sentence — `no rule named it: the tier default
        decided` — rather than as a blank. io-harness's own documentation is explicit that an
        unnamed action in the grey tier is the least vouched-for kind, so silence there would tell
        the reader the opposite of what happened. Its own test."
      - "`Ctrl+C` while a question is open interrupts the turn rather than answering it, which
        settles one of the contract's open questions. The question is then denied as a consequence
        of the turn ending — `App::finished` drops the overlay — rather than by giving one key two
        meanings. Everything else on the keyboard goes to the overlay while it is up, because the
        run is stopped and there is nothing to type at."
      - "`cargo test --test picker --test scrollback --test narrow --test timing` — 14 passed, so
        making `fit` public changed no picker behaviour, the scrollback discipline is intact, and no
        clock or sleep entered the suite. `cargo clippy --all-targets -- -D warnings` exit 0."

  - id: US-IO-CLI-0.2.0-T03
    summary: Bind the three answers, commit one line per decision, and hand the harness a real approver.
    why_required: "This is the task that closes the dead end 0.1.0 and 0.1.1 both shipped: until the
      driver stops passing `DenyAll`, the *ask before writes* posture declines everything and the
      overlay has nothing to open on."
    status: done
    depends_on:
      - US-IO-CLI-0.2.0-T02
    acceptance_criteria:
      - >
        **F3 — each answer resolves the request as itself, and commits exactly one
        line.** Allow once, allow for the rest of the session and deny each produce
        the matching `io_harness::Decision`, and each closes the overlay and commits
        one line naming the act, the target and the decision. Sabotage: map every key
        to allow, under which only F3 fails.
    files:
      - src/approval.rs
      - src/app.rs
      - src/main.rs
      - src/settings.rs
      - tests/approval.rs
    evidence:
      - "`DenyAll` is gone from the driver. `turn` now builds an `approval::channel()` alongside the
        steer channel and the observer bridge, and a new arm in the select loop opens the overlay
        when a question arrives. The loop keeps turning while the run is stopped inside
        `decide_in_context`, which is what leaves `Ctrl+C` reachable with a question on screen."
      - "`cargo test --test approval` — 11 passed, 0 failed. F3 runs all three answers through the
        same body: press the key, assert the overlay closed, assert the `io_harness::Decision` the
        run was actually given, and assert exactly one line was committed and that it names the act
        and the target. `Once` is asserted to remember *nothing*, which is the half a looser test
        would miss."
      - "The `Session` answer hands the run one rule — `Act::Write` on `src/main.rs`, the target as
        written rather than a widened glob. A bare filename is matched against a basename too, so
        `main.rs` as a pattern would have allowed that name anywhere in the tree."
      - "Sabotage F3 — every character key answers `Once`: 2 failed, both of them F3's. The second
        is the keyboard-capture test, which fails for the same reason and belongs to the same
        criterion; nothing outside F3 moved."
      - "The other way in is its own test: three `Right`s and `Enter` reaches `deny`, and the third
        `Right` is clamped rather than wrapped. A surface that wraps from deny back to allow is one
        where holding an arrow key approves a write. The overlay opens on `Once`, the least
        committal answer, so `Enter` by reflex gives away the least."
      - "A question takes the keyboard while it is up: two letters typed at an open overlay leave
        the composer empty. The run is stopped, so a keystroke reaching the composer would be one
        whose effect the operator never sees."
      - "The wizard's own words are now true. The *ask before writes* posture described itself as
        `declined until the approval surface lands` through two releases, because the approver was
        `DenyAll`; it now reads `read freely; a write or a command stops and asks you first`."
      - "`cargo test` — the whole suite, 121 passed, 0 failed, 4 ignored (`tests/live.rs`, ignored by
        design). `cargo clippy --all-targets -- -D warnings` exit 0."

  - id: US-IO-CLI-0.2.0-T04
    summary: Carry a remembered allow into the Policy the next turn runs under.
    why_required: "`Decision::Approve { remember }` installs a run-scoped layer that dies with the
      turn. Without this task, *allow for the rest of this session* asks again on the next prompt and
      reads as a defect in memory rather than as a scope this release chose."
    status: done
    depends_on:
      - US-IO-CLI-0.2.0-T03
    acceptance_criteria:
      - >
        **F5 — *allow for the rest of this session* survives the turn it was given
        in.** Asserted on the `Policy` handed to the *next* turn: it carries a rule
        that the previous answer produced. The harness's own `remember` is
        run-scoped and dies with the turn, so an implementation that uses only it
        passes F3 and fails F5 — which is the whole reason this is its own criterion.
        Sabotage: pass `remember` and keep nothing, under which only F5 fails.
    files:
      - src/approval.rs
      - src/main.rs
      - tests/approval.rs
    evidence:
      - "`approval::effective_policy(base, remembered)` is io-harness's own recipe rather than a
        second one: a permissive layer named `remembered` carrying the rules, merged onto the base.
        It was copied from `run.rs`, where the harness applies `remember` for the rest of a run, so
        the semantics across a turn boundary are the same ones as within a turn."
      - "The driver rebuilds it before every turn from `App::remembered()`. With nothing remembered
        it returns the session's policy unchanged, asserted as equality rather than assumed."
      - "`cargo test --test approval` — 14 passed, 0 failed. F5 is asserted as a *verdict*, not as a
        label: the base policy answers `Ask` for a write to `src/main.rs`, and after the operator
        answers `allow this session` the next turn's policy answers `Allow`. A rule that is carried
        but never consulted would pass a label check and fail this one."
      - "Narrowness has its own assertion: the same next-turn policy still answers `Ask` for
        `src/other.rs`. Saying yes to one file is not saying yes to writing."
      - "**A remembered allow cannot defeat a deny**, and that is its own test against the case that
        matters — `.env`, which the harness's `builtin-secrets` layer denies. Feeding an explicit
        `Allow` rule for `.env` through `effective_policy` still yields `Deny`. This is the property
        that makes it safe for io-cli to construct rules at all."
      - "Sabotage F5 — hand the harness `remember` and keep nothing on this side: 1 failed, F5's
        test alone. F3's `Session` case stayed green, which is exactly what the contract predicted
        and the reason F5 exists as a separate criterion: the obvious implementation passes every
        visible test and asks again on the next prompt."
      - "`cargo test` — 23 test binaries, all ok, 0 failures. `cargo clippy --all-targets -- -D
        warnings` exit 0."

  - id: US-IO-CLI-0.2.0-T05
    summary: Cycle the posture on Shift+Tab, name the layer in force, and run the next turn under it.
    why_required: "The roadmap's outcome is that the operator can *see and steer* the boundary. The
      overlay is the answering half; this is the choosing half, and without the status field naming
      the layer the key would be a mode indicator that indicates nothing."
    status: done
    depends_on:
      - US-IO-CLI-0.2.0-T04
    acceptance_criteria:
      - >
        **F6 — `Shift+Tab` cycles the posture and the status line names the layer in
        force.** Both spellings a terminal may send — `BackTab`, and `Tab` with the
        shift modifier — reach the same action, or the key works in one class of
        terminal and silently does nothing in the other. Sabotage: cycle without
        updating the field, under which only F6 fails.
      - >
        **F7 — the cycled posture is what the next turn actually runs under.**
        Asserted on the `io_harness::Policy` handed to the turn, not on the label
        beside it. A mode indicator not backed by the thing it names is invisible to
        any assertion on a rendered line. Sabotage: update the label only, under
        which only F7 fails.
    files:
      - src/app.rs
      - src/status.rs
      - src/settings.rs
      - src/commands.rs
      - src/main.rs
      - README.md
      - tests/commands.rs
      - tests/status.rs
      - tests/policy.rs
    evidence:
      - "`Shift+Tab` reaches `App::cycle_posture` from BOTH spellings a terminal can send —
        `KeyCode::BackTab` with no modifier, and `KeyCode::Tab` with shift, which is what a terminal
        that has negotiated the Kitty keyboard protocol sends instead. Its own test, because binding
        one alone ships a key that works on the developer's terminal and does nothing on somebody
        else's, silently."
      - "The status line's second field is `policy:workspace` / `policy:ask-writes` /
        `policy:read-only` — second because what the agent is allowed to do outranks how long it has
        been doing it, and second-to-last to be dropped when the terminal is narrow."
      - "`approval::session_policy(base, posture, remembered)` replaces the policy's *tier defaults*
        and nothing else, then layers the remembered allows on top. That is what makes a keystroke
        safe here: a layer that denies a secret is not a default, so `no_posture_can_unlock_what_a_
        layer_denied` passes for all three postures against `.env`."
      - "`cargo test --test policy` — 7 passed, 0 failed. F7 is asserted as a verdict on the policy
        (`Allow`, then `Ask`, then `Deny` for a write to `src/main.rs` as the key is pressed), never
        on the word beside it."
      - "Sabotage F6 — cycle the posture without updating the field: 1 failed, F6's status test
        alone; the F7 policy test stayed green, which is precisely the split the two criteria exist
        to catch. Sabotage F7 — update the label and ignore the posture when building the policy:
        1 failed, F7's test alone, with every F6 test green."
      - "A configuration file whose policy is none of the three reads `policy:custom` rather than
        being labelled as one it is not; io-harness's own file can express far more than three
        postures. The first press of the key then moves to a posture the operator did choose.
        `Posture::of` is asserted exact in both directions."
      - "Cycling changes this session, like `/theme` and `/model`, and takes effect on the next turn
        because io-harness takes a `&Policy` per turn and offers no way to change one mid-flight.
        The committed line says which posture and what it means, so the key teaches itself."
      - "The key table grew two rows — `Shift+Tab` and `y / a / n` — in `commands.rs`, which is the
        one list the README and `/help` both render. `tests/commands.rs` had to be updated in the
        same commit because it asserts the count, which is the gate working rather than failing."
      - "`cargo test` — 24 test binaries, all ok, 0 failures. `cargo fmt --all -- --check` exit 0;
        `cargo clippy --all-targets -- -D warnings` exit 0."

  - id: US-IO-CLI-0.2.0-T06
    summary: Give a refusal its own cell — act, target, rule, layer, and the tier default said plainly.
    why_required: "This is the product's third success measure written as a test, and the two facts
      no competing core records. 0.1.0 shipped a plain notice as a placeholder and named this release
      as the one that replaces it."
    status: done
    depends_on:
      - US-IO-CLI-0.2.0-T05
    acceptance_criteria:
      - >
        **F8 — a refusal renders act, target, rule and layer, in that order, and an
        absent rule reads as the tier default rather than as silence.** Asserted by
        position, and asserted twice: once with a named rule and layer, once with
        neither, because in io-harness `None` means the tier default decided and that
        is a different sentence, not a missing one. Sabotage: drop the layer, under
        which only F8 fails.
    files:
      - src/events.rs
      - tests/events.rs
    evidence:
      - "A refusal now reads `write /etc/hosts · rule fs.deny · layer ops-baseline`, separated by
        the same ` · ` the status line and the step line use. Act, target, rule, layer — and the
        last two are the facts no other terminal agent can print."
      - "`cargo test --test events` — 15 passed, 0 failed. The order is asserted by position with a
        lookup closure, never by `contains`."
      - "Three cases, three tests, because io-harness has three: a named rule in a named layer; a
        rule with no layer; and neither, which means the *tier default* decided. The third renders
        `no rule named it: the tier default decided` rather than a blank — the harness's own
        documentation is explicit that an unnamed action in the grey tier is the least
        vouched-for kind, so silence there would tell the reader the opposite of what happened."
      - "Sabotage F8 — drop the layer from the line: 2 failed, F8's ordering test and the
        pre-existing every-styled-kind test, which also asserts the layer. Both belong to this
        criterion; nothing outside it moved."
      - "`ApprovalRequested` stopped claiming what it used to. It said the release `answers from the
        configured posture`, which was `DenyAll`; it now says `waiting for you` and stays one thin
        line, because the event carries only the act and the target — the rule, the layer and the
        content reach the overlay on the approver seam instead."
      - "`ApprovalDecided` gained an arm of its own. It is io-harness's record of what it was told,
        which is not the same line as io-cli's own; they agree because the answer travelled one way,
        and if they ever disagree this is where it shows."
      - "Two pre-existing tests pinned 0.1.1's wording — that every awaiting-help names `io setup` —
        and 0.2.0 changes what the way out *is*, because an approval is now answered on screen. They
        were widened to assert the property rather than the sentence: each help must name something
        the operator can actually do (`io setup`, `Shift+Tab`, or answering in the next prompt).
        `awaiting_answer` is still a dead end and still says so, because a question about intent
        needs a responder on a caller-supplied contract — the entry point that would cost `Ctrl+C`."
      - "`cargo test` — 24 test binaries, all ok. `cargo clippy --all-targets -- -D warnings` exit 0."

  - id: US-IO-CLI-0.2.0-T07
    summary: Fill the status line's remaining fields, each absent until something supplies it.
    why_required: "The status line is where this product's differentiation is meant to be visible at
      a glance, and it has carried three fields and four named placeholders since 0.1.0. A field that
      invents a value it did not receive would be worse than the placeholder."
    status: done
    depends_on:
      - US-IO-CLI-0.2.0-T06
    acceptance_criteria:
      - >
        **F9 — a status field with nothing behind it is absent, not zero.** Before
        any `Contained` event the line carries no containment field; after one it
        carries the mode and the backend together. The same for context pressure and
        the token count. Sabotage: render a zero for an unknown value, under which
        only F9 fails. A field that invents its own value is worse than no field.
    files:
      - src/status.rs
      - src/app.rs
      - tests/status.rs
    evidence:
      - "Three fields, each `Option` and each set only by the event that carries its fact:
        `tokens` from `Step` (and from `Finished`, which is authoritative), `context` from
        `Compacted`, `containment` from `Contained`. Nothing initialises to a default, so a fact
        that has not arrived renders as nothing at all."
      - "`cargo test --test status` — 12 passed, 0 failed. F9's own test asserts a fresh line
        carries no `tok`, no `ctx` and no containment."
      - "Sabotage F9 — initialise the three to `Some(0)`, `Some(0)` and `Some(\"unknown\")`: 3
        failed, all three of them status tests, including the narrow-form one, which is the same
        criterion's other half. The rest of the suite was untouched."
      - "**The elapsed field stays fourth and the new ones go to its right**, so the field 0.1.1
        exists for is not the first thing a narrow terminal drops. Asserted at forty columns: the
        line stays one row, keeps the model, and has lost the containment field."
      - "Containment renders as `workspace-write/seatbelt` — the mode asked for *and* the backend
        that answered on this host. io-harness's own documentation is explicit that showing the mode
        alone is reading an intention: `workspace-write` reaching a portable floor means resource
        caps and nothing else. Its own test, against exactly that pair."
      - "Context pressure's denominator is `io_harness::ContextBudget::default().effective_tokens
        (None)` — asked of the harness rather than copied here. A `24_000` written into this
        repository would be wrong after some harness patch, and wrong silently."
      - "**The field is quiet by design and that is recorded rather than hidden.** `Compacted` is
        the only event carrying an observation-section size, so between folds nothing on the stream
        knows it and the field is absent. The per-step estimate is durable in the store as
        `ContextEvent::est_tokens`; the upgrade path is one store read and is marked with a
        `ponytail:` comment where the field is declared. The contract left this decision to the
        first rendering against a real session, and this is it."
      - "The token field is the session's running total rather than the last step's own count — a
        field that swings rather than climbs cannot be read at a glance — and it is formatted
        `12.4k`, because six digits are six columns of a line that must fit in eighty."
      - "`cargo test` — 24 test binaries, all ok. `cargo clippy --all-targets -- -D warnings` exit
        0 (one collapsible-if moved into a match guard, which reads better anyway: a run reporting
        no usage reports `0`, and overwriting a real total with it would turn a known number into a
        wrong one). `cargo fmt --all -- --check` exit 0."

  - id: US-IO-CLI-0.2.0-T08
    summary: Give every new surface a defined form at eighty columns.
    why_required: "`product.yaml` fixes 80x24 as a supported size rather than a degraded one. An
      overlay carrying four facts and a file's content is the widest thing this product has drawn,
      and the status line now has three more fields to drop."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T07
    acceptance_criteria:
      - >
        **N5 — every new surface has a defined form at eighty columns**, and the
        status line still drops whole fields from the right rather than wrapping,
        with three more fields to drop. `tests/narrow.rs` covers the line; the
        overlay joins it, including the case where the proposed content is wider than
        the terminal.
    files:
      - src/approval.rs
      - src/status.rs
      - tests/narrow.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T09
    summary: Bring the documented surfaces and the structural gates up to what the release now is.
    why_required: "The README's key table, `/help` and the CHANGELOG are checked mechanically against
      the code, and the README has told every reader since 0.1.0 that the approval overlay is 0.2.0's.
      The structural gates are what stop a release that adds an overlay from quietly adding a
      dependency, a clock or a full-screen clear."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T08
    acceptance_criteria:
      - >
        **N1 — no timing assertion anywhere, a third time.** `tests/timing.rs` still
        passes: no test sleeps, no test reads a clock, and `src/main.rs` is still the
        only module that does. The approval path is the shape most likely to be
        tested with a timeout, and F4 exists so that it is not.
      - >
        **N2 — the dependency set does not grow.** `cargo tree --depth 1` is still
        the eight names 0.1.0's N1 permits, plus `tempfile` as a dev-dependency. An
        approval channel is `tokio::sync::oneshot`, which is already here.
      - >
        **N3 — every structural property of 0.1.0 still holds.** No alternate
        screen, no mouse capture, no full-screen clear, the terminal always restored,
        the credential never rendered. The existing tests carry these, and an overlay
        that shows a file's proposed content is exactly the kind of change that could
        put a secret on screen — the credential test is not incidental here.
      - >
        **N4 — io-cli still contains no policy engine.** `tests/dependencies.rs`
        still passes. This release renders a `Policy`, constructs `io_harness::Rule`
        values from a human's answer, and relays that answer. It evaluates no rule
        and decides no permission; every verdict is still the harness's.
      - >
        **O2 — the binary builds in release profile and runs.** Standing gate; CI
        builds the test profile only.
    files:
      - README.md
      - CHANGELOG.md
      - Cargo.toml
      - Cargo.lock
      - src/commands.rs
      - tests/docs.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T10
    summary: The owner runs a real turn under ask-before-writes, approving one write and denying another.
    why_required: "What this release ships is a moment — a run stopping to ask, and a person
      answering it. A test can assert that a decision reached the harness and cannot say whether the
      overlay read as clear or as alarming. The same human gate 0.1.0 and 0.1.1 both carried."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T09
    acceptance_criteria:
      - >
        **F10 — the owner runs a real turn under *ask before writes*, approves one
        write, denies another, and says the overlay reads right.** Manual and
