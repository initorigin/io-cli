  - id: US-IO-CLI-0.1.0-T14
    summary: "Assert the forbidden subsystems are absent: no HTTP client, TLS stack, SQL or sandboxing
      crate in the dependency set, and no provider-response loop in the source."
    why_required: F7 is the criterion that keeps the archived fork from growing back, and N1 is the
      evidence reviewed at completion. It is written last on purpose, when the dependency set is
      final and the assertion is meaningful.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T13
    acceptance_criteria:
      - >
        **F7 — the forbidden subsystems are absent.** A test over `Cargo.toml` asserts the
        dependency set contains no HTTP client, no TLS stack, no SQL or database crate, and no
        sandboxing crate, and a grep asserts the source contains no `async fn` that loops over
        provider responses. The only path to a model is through `io_harness`. Sabotage: add
        `reqwest` as a direct dependency, under which only F7 fails. This is the criterion that
        keeps the archived fork from growing back.
      - >
        **N1 — io-cli contains no second harness.** `cargo tree --depth 1` is recorded in the
        release evidence and reviewed: `io-harness`, `ratatui`, `crossterm`, `tui-textarea`, `clap`,
        `tokio`, `serde`/`toml`, and nothing that constitutes a runtime, a client or a store. Any
        addition beyond that list is argued in the release record or it does not ship.
    files:
      - tests/dependencies.rs
    evidence:
      - 76 tests pass; fmt and clippy -D warnings exit 0. Seven of them are F7 and N1.
      - "The dependency set is asserted BOTH ways: nothing beyond the eight the contract names, and
        nothing the contract permits that has stopped being used. A dependency added quietly fails
        the build; one that is genuinely needed is argued in the release record and added to the
        list, which is a decision somebody makes rather than a line somebody adds."
      - Twenty-three named crates are refused by name — HTTP clients, TLS stacks, databases,
        sandboxing crates and a provider client — matched against DIRECT dependencies only, because
        a transitive one arrives through io-harness and is the harness's business.
      - "The agent-loop assertion is coarse on purpose: a file that calls a provider must contain no
        top-level loop, while, or for. Being coarse is what makes it hard to creep past. io-cli
        calls a provider EXACTLY ONCE in the whole crate — the wizard's verification handshake — and
        the test asserts that count, so a second call anywhere fails it."
      - "Also asserted: no std::process::Command, no TcpStream, no std::net (running a command is
        the harness's tool layer, inside its sandbox — one here would be a tool no policy governs
        and no trace records); no toml::from_str anywhere, because configuration is io-harness's and
        a second parser would be a second, disagreeing answer to what a config file means; one
        binary, named io; and publish = false."
      - "SABOTAGE DD — add reqwest as a direct dependency: exactly the two dependency-set tests
        fail."
      - "SABOTAGE EE — add a second provider call inside a loop: only the agent-loop test fails."
  - id: US-IO-CLI-0.1.0-T15
    summary: "Add `release.yml`: a cross-compile matrix producing the four artifacts plus `SHA256SUMS`,
      attached to the Release the tag cuts."
    why_required: The GitHub Release is the product's only distribution channel, and O5 requires all
      four artifacts and the checksum file to exist on it. The musl row is the one most likely to
      fail, so it is proved before the release branch depends on it.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T02
    acceptance_criteria:
      - >
        **O5 — every artifact in the matrix exists and every installer works on a clean machine.**
        The Release carries all four artifacts plus `SHA256SUMS`. `install.sh` is then run on a
        clean macOS machine and in a clean Linux container, and `install.ps1` on a clean Windows
        machine, each followed by running `io --version` **in a new shell** — which is what catches
        a script that installed correctly and told the user nothing useful about `PATH`. An
        installer verified only on the machine that built it is not verified.
      - >
        **O6 — the Release is cut by pushing the tag, and nothing else.** `gh release create` is
        never used: it produces a Release with no assets. The workflow the tag triggers is what
        attaches them, and the Release title is the bare form this line of repositories uses.
    files:
      - .github/workflows/release.yml
    evidence:
      - release.yml cross-compiles four targets — aarch64-apple-darwin, x86_64-apple-darwin,
        x86_64-unknown-linux-musl, x86_64-pc-windows-msvc — writes SHA256SUMS over all four, and
        attaches all five to the Release the TAG cuts. gh release create is never used; it produces
        a Release with no assets, and the assets are the whole channel here.
      - The musl row installs musl-tools and sets CC and the linker, because io-harness carries
        rusqlite with a bundled C SQLite. Without it the build fails inside a dependency's build
        script, which reads like a toolchain bug and is not one. It is the row most likely to break
        and it is why fail-fast is off.
      - Every job runs the built binary with --version where the runner can execute it. A binary
        that builds and will not start is exactly what a test profile hides from a release profile,
        and it costs one line per target.
      - "A checks job runs first and alone: the tag must equal Cargo.toml's version and the
        CHANGELOG must have that section. Four cross-compiles is an expensive way to discover a
        mismatched tag."
      - The release job asserts SHA256SUMS has four lines, so a partial upload is a named failure
        rather than a checksum file that happens to be short.
      - "Every uses: is pinned to a full-length commit SHA with the version in a trailing comment;
        no job id contains a dot; concurrency does not cancel in progress."
  - id: US-IO-CLI-0.1.0-T16
    summary: "Write `install.sh` and `install.ps1`: resolve the artifact, verify it against `SHA256SUMS`
      before unpacking, install into a per-user directory, and print the `PATH` line rather than
      editing a profile."
    why_required: N7 is the one place in this product where a failure is a security failure, and N8
      requires an install to need no administrator rights. There is no other way to install io-cli,
      so the release does not exist without these two scripts.
    status: done
    depends_on:
      - US-IO-CLI-0.1.0-T15
    acceptance_criteria:
      - >
        **N7 — an installer never runs an unverified binary.** Both scripts compute the artifact's
        SHA-256 and compare it against the published `SHA256SUMS` before unpacking, and **abort
        non-zero on a mismatch without leaving anything on disk**. Asserted by running each
        installer against a deliberately corrupted artifact and checking both the exit status and
        that the target directory is untouched. This is the one place in the product where a failure
        is a security failure rather than an inconvenience, and `curl | sh` is a trust-the-publisher
        model regardless — the checksum defends against a truncated download and a tampered asset,
        not against a compromised repository, and the README says so rather than implying more.
      - >
        **N8 — an install needs no administrator rights.** Neither script writes outside the user's
        own directories and neither invokes `sudo`. Asserted by running each as an unprivileged user
        with no write access to any system path.
    files:
      - install.sh
      - install.ps1
      - tests/installers.rs
    evidence:
      - 82 tests pass; fmt and clippy -D warnings exit 0. Six of them are the installers', and they
        run install.sh END TO END against a local release served over file:// — a real archive, a
        real SHA256SUMS, a real unpack, and the installed stand-in executed afterwards.
      - "N7 the good path: checksum ok, the binary installs, running it produces the content that
        was inside the archive, and the script PRINTS the PATH line instead of editing a shell
        profile behind the user's back."
      - "N7 the bad path: the archive is corrupted AFTER its checksum is computed, so the mismatch
        is real rather than a wrong number written into the file. The script exits non-zero, says
        'checksum mismatch' and 'Nothing was installed', and THE TARGET DIRECTORY IS NEVER EVEN
        CREATED."
      - "N7 the missing-line path: a SHA256SUMS that does not mention this artifact is a refusal,
        not a skip. That is the one path where an installer would do the thing it exists to
        prevent."
      - The script also refuses outright when neither sha256sum nor shasum is on PATH, for the same
        reason.
      - "SABOTAGE FF — verify after unpacking: only the ORDER test failed, because the unpack
        happens inside the temp directory and the target is still untouched. That is a finding about
        the two tests rather than a gap: they cover different halves and neither is redundant."
      - "SABOTAGE HH — install first and verify afterwards, which is the genuinely dangerous
        ordering: THREE tests fail, including the corrupt-artifact one on the untouched-directory
        assertion."
      - "SABOTAGE GG — default to /usr/local/bin: only the no-administrator-rights test fails."
      - "N8 is asserted on both scripts: no sudo, doas, runas or elevation verb; the unix default is
        under HOME and the Windows one under LOCALAPPDATA; install.ps1 sets the USER PATH and is
        asserted never to touch the machine PATH, which would need administrator rights and change
        the environment for everybody on the box."
      - A cross-file test asserts the artifact naming the installers resolve is the naming
        release.yml produces. The install command is the first thing a user depends on and the two
        facts live in three files.
      - OPEN QUESTION ANSWERED — the script resolves the LATEST release by default, via the
        /releases/latest redirect, so re-running it is the update mechanism; IO_VERSION pins a
        version for anyone who needs yesterday's install. No API token and no JSON parser.
