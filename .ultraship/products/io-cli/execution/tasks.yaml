        **N7 — an installer never runs an unverified binary.** Both scripts compute the artifact's
        SHA-256 and compare it against the published `SHA256SUMS` before unpacking, and **abort
        non-zero on a mismatch without leaving anything on disk**. Asserted by running each
        installer against a deliberately corrupted artifact and checking both the exit status and
        that the target directory is untouched. This is the one place in the product where a failure
        is a security failure rather than an inconvenience, and `curl | sh` is a trust-the-publisher
        model regardless — the checksum defends against a truncated download and a tampered asset,
        not against a compromised repository, and the README says so rather than implying more.
    files:
      - README.md
      - CHANGELOG.md
      - docs/config.example.toml
      - tests/docs.rs
