product: io-cli
version: 0.1.1
tasks:
  - id: US-IO-CLI-0.1.1-T01
    summary: Give the session a clock it can be ticked by, and repaint on it only while a turn runs.
    why_required: "This is the release. Without a tick the clock advances only when an event happens
      to arrive, which is the defect being fixed, and without the injected clock the tick cannot be
      asserted without measuring time — which N1 forbids."
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F1 — the viewport repaints while a turn runs, with no event arriving.**
        Driven by a clock the test controls: with a turn in flight and no run event
        delivered, advancing the clock produces a new frame whose status line
        differs from the previous one. Sabotage: only repaint on an event, under
        which only F1 fails. No assertion anywhere on how long anything took.
      - >
        **F2 — an idle session does not repaint.** With no turn running, advancing
        the same clock produces no frame at all. This is the other half of F1 and
        the more important one: a terminal interface that redraws forever is the
        thing this renderer exists not to be. Sabotage: tick unconditionally, under
        which only F2 fails.
    files:
      - src/app.rs
      - src/main.rs
      - tests/tick.rs
    evidence:
      - "`App::tick(age) -> bool` is the seam. It takes the session's age as an argument rather than
        reading a clock, so a test advances time by hand; it returns whether a frame is owed rather
        than drawing one, so the decision is observable without a terminal."
      - "`cargo test --test tick` — 4 passed, 0 failed. F1 repaints across two ticks with no event
        ever delivered to the app; F2 pumps ten idle ticks and asserts the recorder gained not one
        byte, which is `no frame at all` rather than `a frame that changed nothing`."
      - "Sabotage A — the tick never repaints (`self.status.elapsed = age; true` becomes `false`):
        1 failed, and it is F1's test alone. Sabotage B — the `Mode::Running` guard deleted so the
        tick fires unconditionally: 3 failed, all three of them F2's. Neither arm fails the other's
        test."
      - The driver's ticker is built inside `turn` and dropped with it, so an idle session has no
        timer at all — the guard in `App::tick` is the half a test can see and the ticker's lifetime
        is the half that makes it true in production.
      - "`MissedTickBehavior::Delay` rather than the default burst: a turn that blocked the select
        loop resumes ticking from now instead of firing a catch-up run of frames nobody saw."
      - No test in this file sleeps, and none reads a clock. `cargo check --all-targets` exits 0.

  - id: US-IO-CLI-0.1.1-T02
    summary: Put a moving indicator beside the status line's state word, and suppress it under NO_COLOR.
    why_required: The clock advancing answers "is it alive" once a second; the indicator answers it
      continuously, which is what the first thirty seconds of a slow first token needs. It rides the
      same tick, so it exists only because T01 does.
    status: done
    depends_on:
      - US-IO-CLI-0.1.1-T01
    acceptance_criteria:
      - >
        **F4 — the state word survives everything the animation does not.** Under
        `NO_COLOR` the indicator does not animate and the word is still there;
        the status line's narrow form still drops whole fields rather than wrapping.
        Sabotage: replace the word with the spinner, under which only F4 fails.
      - >
        **N2 — the dependency set does not grow.** `cargo tree --depth 1` is still
        the eight names 0.1.0's N1 permits. A spinner is a handful of characters and
        a modulo; a crate for it would be the beginning of the thing this product
        exists not to become.
    files:
      - src/app.rs
      - src/status.rs
      - tests/status.rs
    evidence:
      - "The indicator is a PREFIX on the state field, never the field: `⠋ working` when the theme
        emits colour, `working` when it does not. `Status::indicator` returns `None` under
        `NO_COLOR` and `None` when nothing is running, so the two suppressions are one expression
        rather than two call sites that could drift."
      - "Ten braille frames and a modulo, in `status::SPINNER`. Braille because every frame is
        exactly one cell wide — a spinner of mixed-width characters shifts the whole line as it
        turns, which is worse than not moving."
      - "`Status::advance` is called from `App::tick` and from nowhere else, so the animation cannot
        outlive the turn it reports on; `cargo test --test status` — 7 passed, 0 failed, including a
        full cycle of ten frames asserting `NO_COLOR` keeps the word and shows no frame at all."
      - "Sabotage — the spinner replaces the word (`format!(\"{frame} working\")` becomes
        `format!(\"{frame}\")`): 4 failed, every one of them in `tests/status.rs`, and nothing
        anywhere else in the suite. The narrow-form test is among them because it asserts the whole
        line exactly, which is what makes it able to see a missing word."
      - "N2 — `cargo tree --depth 1` is the same eight names 0.1.0 permits: clap, crossterm 0.28.1,
        io-harness 0.60.1, ratatui 0.29.0, serde, tokio, toml, tui-textarea, plus the tempfile
        dev-dependency. Nothing was added for the animation."
      - The narrow form still drops whole fields from the right and still never wraps; the two
        threshold widths in its test moved by the two cells the indicator occupies.

  - id: US-IO-CLI-0.1.1-T03
    summary: Render a step as decision, then tool and target, then result, with the count and the step number trailing.
    why_required: A step is the unit a transcript is skimmed in, and 0.1.0 committed the decision
      with the step number and a token count wedged into the middle of it. Content before metadata
      is the rule the rest of the interface already follows and this line is the one that broke it.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F5 — a step renders as decision, then tool and target, then result, with
        the count and the step number trailing.** Asserted over the rendered line's
        order, not merely its contents. Sabotage: put the token count in front of
        the decision, under which only F5 fails.
    files:
      - src/events.rs
      - src/status.rs
      - tests/events.rs
    evidence:
      - "The line is now `decision · tool target · result · N tok · step N`, built as spans in that
        order: the decision in the normal tone, the tool in the accent, the result in success or
        muted, and the two metadata facts trailing in muted. 0.1.0 wrote
        `decision  step N · tool · N tok`, with the step number wedged between the decision and what
        it ran."
      - "The result is said in BOTH directions — `changed files` or `no change`. A result that
        appears only when something happened is a column a reader cannot skim down, and `changed` is
        the only thing this event reports about what came back."
      - "`cargo test --test events` — 12 passed, 0 failed. The two new tests assert the ORDER, by
        comparing the positions of the five facts within the rendered line, rather than asserting
        that the line contains them."
      - "Sabotage — the token count moved in front of the decision: 2 failed, and they are exactly
        the two F5 tests. The whole rest of the suite passed, including the existing step assertion,
        which only checks that the facts are present and cannot see an order change. That is why the
        new tests assert positions."
      - The separator is now `status::SEPARATOR` rather than a second literal — one separator in the
        product, so a step line and the status line under it read as one surface.

  - id: US-IO-CLI-0.1.1-T04
    summary: Assert mechanically that no test in the suite sleeps or measures elapsed time.
    why_required: N1 is the constraint the whole clock seam exists to satisfy, and a constraint
      checked by reading is a constraint that decays. This release adds a timer, which is exactly
      the kind of work that grows a sleeping test in the next one.
    status: todo
    depends_on:
      - US-IO-CLI-0.1.1-T01
    acceptance_criteria:
      - >
        **N1 — no timing assertion anywhere, again.** Inherited from 0.1.0 and
        re-checked mechanically: no test measures elapsed time and no test sleeps.
        The tick is driven by an injected clock precisely so that this holds.
      - >
        **N3 — every structural property of 0.1.0 still holds.** No alternate
        screen, no mouse capture, no full-screen clear, the terminal always
        restored, the credential never rendered. The existing tests carry these and
        they must all still pass — a release that adds a repaint loop is exactly the
        kind that could quietly start clearing the screen.
    files:
      - tests/timing.rs
    evidence: []

  - id: US-IO-CLI-0.1.1-T05
    summary: Bump the version to 0.1.1, write the changelog entry, and recapture the README screenshot from the corrected interface.
    why_required: The screenshot is in the release's scope because 0.1.0 recorded that it could not
      supply one; the version and the changelog are what make the Release installable and legible.
      Without this task the release ships as 0.1.0.
    status: todo
    depends_on:
      - US-IO-CLI-0.1.1-T01
      - US-IO-CLI-0.1.1-T02
      - US-IO-CLI-0.1.1-T03
    acceptance_criteria:
      - >
        **F3 — the owner watches a real turn and says it reads as alive.** Manual,
        recorded, and the recording replaces the README's screenshot. The same human
        gate 0.1.0 put on its look; a test can assert a frame changed and cannot
        assert that a person stopped wondering whether it had hung.
      - >
        **O4 — the Release carries the same four artifacts and `SHA256SUMS`**, and
        `install.sh` resolves the new version without change, because the artifact
        naming is part of the public contract and this release must not churn it.
    files:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - README.md
      - tests/docs.rs
      - tests/no_color.rs
    evidence: []
