product: io-cli
version: 0.2.0
tasks:
  - id: US-IO-CLI-0.2.0-T01
    summary: Build the approver seam — a request out, a decision back, and a denial when nobody answers.
    why_required: "Every other task in this release renders or answers an approval, and none of them
      can exist until an approval can reach the interface at all. It is also the one place the
      product can deadlock: the approver runs on the agent's own task, so the release is not correct
      unless a dropped answer denies rather than blocks."
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        **F4 — an unanswered request denies rather than hangs.** Dropping the
        interface end of the answer channel resolves the request as a denial. No
        clock, no timeout, no sleep: the assertion is on what the approver returns
        when the channel is closed. Sabotage: block on the receiver, under which only
        F4 fails — and it fails by never finishing, which is why the arm is run under
        the suite's own harness rather than by hand.
    files:
      - src/approval.rs
      - src/lib.rs
      - tests/approval.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T02
    summary: Render the question as a viewport overlay that commits nothing to scrollback.
    why_required: "An approval that is committed to history can be scrolled away from a run that is
      blocked on it, which is the failure the overlay exists to prevent. This is the structural
      property the whole surface rests on."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T01
    acceptance_criteria:
      - >
        **F1 — an approval request opens an overlay and commits nothing to
        history.** With a request delivered, the viewport holds the question and the
        scrollback gains nothing at all. Sabotage: render the request as a committed
        line, under which only F1 fails. This is the structural property the whole
        surface rests on — a question in the scrollback is a question that can be
        scrolled away from a run that is blocked on it.
      - >
        **F2 — the overlay states the act, then the target, then the rule and the
        layer, in that order.** Asserted over the positions of the facts in the
        rendered lines, never over their presence. Sabotage: put the rule first,
        under which only F2 fails.
    files:
      - src/approval.rs
      - src/picker.rs
      - src/app.rs
      - tests/approval.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T03
    summary: Bind the three answers, commit one line per decision, and hand the harness a real approver.
    why_required: "This is the task that closes the dead end 0.1.0 and 0.1.1 both shipped: until the
      driver stops passing `DenyAll`, the *ask before writes* posture declines everything and the
      overlay has nothing to open on."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T02
    acceptance_criteria:
      - >
        **F3 — each answer resolves the request as itself, and commits exactly one
        line.** Allow once, allow for the rest of the session and deny each produce
        the matching `io_harness::Decision`, and each closes the overlay and commits
        one line naming the act, the target and the decision. Sabotage: map every key
        to allow, under which only F3 fails.
    files:
      - src/approval.rs
      - src/app.rs
      - src/main.rs
      - tests/approval.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T04
    summary: Carry a remembered allow into the Policy the next turn runs under.
    why_required: "`Decision::Approve { remember }` installs a run-scoped layer that dies with the
      turn. Without this task, *allow for the rest of this session* asks again on the next prompt and
      reads as a defect in memory rather than as a scope this release chose."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T03
    acceptance_criteria:
      - >
        **F5 — *allow for the rest of this session* survives the turn it was given
        in.** Asserted on the `Policy` handed to the *next* turn: it carries a rule
        that the previous answer produced. The harness's own `remember` is
        run-scoped and dies with the turn, so an implementation that uses only it
        passes F3 and fails F5 — which is the whole reason this is its own criterion.
        Sabotage: pass `remember` and keep nothing, under which only F5 fails.
    files:
      - src/approval.rs
      - src/main.rs
      - tests/approval.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T05
    summary: Cycle the posture on Shift+Tab, name the layer in force, and run the next turn under it.
    why_required: "The roadmap's outcome is that the operator can *see and steer* the boundary. The
      overlay is the answering half; this is the choosing half, and without the status field naming
      the layer the key would be a mode indicator that indicates nothing."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T04
    acceptance_criteria:
      - >
        **F6 — `Shift+Tab` cycles the posture and the status line names the layer in
        force.** Both spellings a terminal may send — `BackTab`, and `Tab` with the
        shift modifier — reach the same action, or the key works in one class of
        terminal and silently does nothing in the other. Sabotage: cycle without
        updating the field, under which only F6 fails.
      - >
        **F7 — the cycled posture is what the next turn actually runs under.**
        Asserted on the `io_harness::Policy` handed to the turn, not on the label
        beside it. A mode indicator not backed by the thing it names is invisible to
        any assertion on a rendered line. Sabotage: update the label only, under
        which only F7 fails.
    files:
      - src/app.rs
      - src/status.rs
      - src/settings.rs
      - src/commands.rs
      - src/main.rs
      - README.md
      - tests/status.rs
      - tests/policy.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T06
    summary: Give a refusal its own cell — act, target, rule, layer, and the tier default said plainly.
    why_required: "This is the product's third success measure written as a test, and the two facts
      no competing core records. 0.1.0 shipped a plain notice as a placeholder and named this release
      as the one that replaces it."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T05
    acceptance_criteria:
      - >
        **F8 — a refusal renders act, target, rule and layer, in that order, and an
        absent rule reads as the tier default rather than as silence.** Asserted by
        position, and asserted twice: once with a named rule and layer, once with
        neither, because in io-harness `None` means the tier default decided and that
        is a different sentence, not a missing one. Sabotage: drop the layer, under
        which only F8 fails.
    files:
      - src/events.rs
      - tests/events.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T07
    summary: Fill the status line's remaining fields, each absent until something supplies it.
    why_required: "The status line is where this product's differentiation is meant to be visible at
      a glance, and it has carried three fields and four named placeholders since 0.1.0. A field that
      invents a value it did not receive would be worse than the placeholder."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T06
    acceptance_criteria:
      - >
        **F9 — a status field with nothing behind it is absent, not zero.** Before
        any `Contained` event the line carries no containment field; after one it
        carries the mode and the backend together. The same for context pressure and
        the token count. Sabotage: render a zero for an unknown value, under which
        only F9 fails. A field that invents its own value is worse than no field.
    files:
      - src/status.rs
      - src/app.rs
      - src/events.rs
      - tests/status.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T08
    summary: Give every new surface a defined form at eighty columns.
    why_required: "`product.yaml` fixes 80x24 as a supported size rather than a degraded one. An
      overlay carrying four facts and a file's content is the widest thing this product has drawn,
      and the status line now has three more fields to drop."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T07
    acceptance_criteria:
      - >
        **N5 — every new surface has a defined form at eighty columns**, and the
        status line still drops whole fields from the right rather than wrapping,
        with three more fields to drop. `tests/narrow.rs` covers the line; the
        overlay joins it, including the case where the proposed content is wider than
        the terminal.
    files:
      - src/approval.rs
      - src/status.rs
      - tests/narrow.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T09
    summary: Bring the documented surfaces and the structural gates up to what the release now is.
    why_required: "The README's key table, `/help` and the CHANGELOG are checked mechanically against
      the code, and the README has told every reader since 0.1.0 that the approval overlay is 0.2.0's.
      The structural gates are what stop a release that adds an overlay from quietly adding a
      dependency, a clock or a full-screen clear."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T08
    acceptance_criteria:
      - >
        **N1 — no timing assertion anywhere, a third time.** `tests/timing.rs` still
        passes: no test sleeps, no test reads a clock, and `src/main.rs` is still the
        only module that does. The approval path is the shape most likely to be
        tested with a timeout, and F4 exists so that it is not.
      - >
        **N2 — the dependency set does not grow.** `cargo tree --depth 1` is still
        the eight names 0.1.0's N1 permits, plus `tempfile` as a dev-dependency. An
        approval channel is `tokio::sync::oneshot`, which is already here.
      - >
        **N3 — every structural property of 0.1.0 still holds.** No alternate
        screen, no mouse capture, no full-screen clear, the terminal always restored,
        the credential never rendered. The existing tests carry these, and an overlay
        that shows a file's proposed content is exactly the kind of change that could
        put a secret on screen — the credential test is not incidental here.
      - >
        **N4 — io-cli still contains no policy engine.** `tests/dependencies.rs`
        still passes. This release renders a `Policy`, constructs `io_harness::Rule`
        values from a human's answer, and relays that answer. It evaluates no rule
        and decides no permission; every verdict is still the harness's.
      - >
        **O2 — the binary builds in release profile and runs.** Standing gate; CI
        builds the test profile only.
    files:
      - README.md
      - CHANGELOG.md
      - Cargo.toml
      - Cargo.lock
      - src/commands.rs
      - tests/docs.rs
    evidence: []

  - id: US-IO-CLI-0.2.0-T10
    summary: The owner runs a real turn under ask-before-writes, approving one write and denying another.
    why_required: "What this release ships is a moment — a run stopping to ask, and a person
      answering it. A test can assert that a decision reached the harness and cannot say whether the
      overlay read as clear or as alarming. The same human gate 0.1.0 and 0.1.1 both carried."
    status: todo
    depends_on:
      - US-IO-CLI-0.2.0-T09
    acceptance_criteria:
      - >
        **F10 — the owner runs a real turn under *ask before writes*, approves one
        write, denies another, and says the overlay reads right.** Manual and
        recorded. The same human gate 0.1.0 and 0.1.1 put on their look, for the same
        reason: what ships here is a moment, and only a person can say whether a run
        stopping to ask reads as clear or as alarming.
      - >
        **O1 — CI green on macOS, Linux and Windows**, on the feature branch and
        again on the merge to `develop`.
    files:
      - .ultraship/products/io-cli/execution/tasks.yaml
    evidence: []
