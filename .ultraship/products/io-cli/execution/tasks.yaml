  - id: US-IO-CLI-0.1.0-T19
    summary: "Run the live first run end to end against a real provider and record it: wizard, verified
      key, written file, streamed answer, sandboxed edit, interrupt, exit, then the terminal's own
      search and selection over the transcript."
    why_required: F1 is the release's only criterion that a fixture cannot prove, and the recording is
      both the release evidence and the README screenshot. The owner's approval of the rendered look
      is taken from it.
    status: todo
    depends_on:
      - US-IO-CLI-0.1.0-T18
    acceptance_criteria:
      - >
        **F1 — the live first run.** From an empty `$IO_CONFIG_HOME`, in a real repository, against
        a real provider: the wizard is completed, the key is verified by a live call, the file is
        written, a task is typed, the answer streams, a file is edited inside the sandbox, `Ctrl+C`
        interrupts a second turn mid-flight, and `Ctrl+D` exits. Afterwards, in the same terminal,
        the transcript is searched with the terminal's own search and a passage is selected with the
        mouse and pasted elsewhere. Manual, recorded, and the recording is the release evidence. A
        fixture cannot prove this; only a live run can.
    files: []
    evidence: []
