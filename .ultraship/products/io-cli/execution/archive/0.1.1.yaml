product: io-cli
version: 0.1.1
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: high
  reasons:
    - "The workspace records `preferences.minimize_cost: true` and `allow_parallel_agents: false`,
      so this is a sequential build with no fan-out. Five small tasks against an existing suite fit
      that limit comfortably: the release adds one seam, one field and one line format, and every
      one of them is asserted in the harnesses 0.1.0 already built."
    - The workspace records no time, token or monetary budget — `resource_profile.available` is null
      on every field — so nothing caps this release except the work itself, and the contract carries
      a fallback scope that drops the step rendering and then the spinner if it does.
    - "The workspace constraint that io-cli contains no agent loop, no provider client and no
      session store is not touched by this release. Everything here is rendering: a timer, a field
      and a line order. No io-harness change is required and none is anticipated."
    - The code this release changes is four files totalling under a thousand lines — `src/app.rs`,
      `src/status.rs`, `src/events.rs` and the driver's select loop — and each already has a test
      file pointed at it.
  major_cost_drivers:
    - The clock seam. The work is not the timer; it is making the tick assertable without asserting
      on time, which is what keeps N1 true. Getting that seam wrong is the way this release grows a
      sleeping test.
    - Not repainting when idle. The easy implementation ticks always, and F2 exists because that is
      the version that would ship by accident.
    - "F3, which cannot be automated: a real turn against a live provider, watched by the owner, and
      a screenshot recaptured from it."
  recommended_scope_change: null
