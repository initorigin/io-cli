completed_acceptance:
  - >
    **F2 — the wizard writes what it showed.** A test drives the wizard over the `TestBackend` with
    a scripted key sequence and asserts the resulting file parses under
    `io_harness::Config::from_toml`, that `provider_spec()` returns the chosen variant with the
    chosen model, and that the file's mode is `0600` on unix. Sabotage: write the file before the
    confirmation screen, under which only F2 fails.
  - >
    **F3 — a bad key does not get past the wizard.** With a provider endpoint that rejects the
    credential, the wizard returns to the credential step carrying the provider's own message, and
    **no file is written**. Sabotage: treat any non-transport error as success, under which only F3
    fails.
  - >
    **F4 — finished content reaches scrollback, not the viewport.** After a scripted session, the
    captured byte stream contains every finished message's text outside the viewport region, and the
    viewport buffer at rest contains only the composer and the status line. Sabotage: render a
    finished message into the viewport instead of committing it, under which only F4 fails.
  - >
    **F5 — no alternate screen and no mouse capture, ever.** Over the same captured byte stream, the
    sequences `ESC[?1049h`, `ESC[?1047h`, `ESC[?1000h`, `ESC[?1002h` and `ESC[?1003h` do not appear.
    This is the release's structural criterion and it is written so that no later release can
    reintroduce fullscreen without failing it. Sabotage: call `EnterAlternateScreen`, under which
    only F5 fails.
  - >
    **F6 — an interrupt stops the turn and keeps the session.** A scripted `Ctrl+C` during a
    streaming turn causes `Steer::interrupt`, the turn ends, the partial output stays committed in
    scrollback, and the composer accepts the next prompt. A second `Ctrl+C` at an idle composer
    exits. Sabotage: drop the interrupt on the floor, under which only F6 fails.
  - >
    **F7 — the forbidden subsystems are absent.** A test over `Cargo.toml` asserts the dependency
    set contains no HTTP client, no TLS stack, no SQL or database crate, and no sandboxing crate,
    and a grep asserts the source contains no `async fn` that loops over provider responses. The
    only path to a model is through `io_harness`. Sabotage: add `reqwest` as a direct dependency,
    under which only F7 fails. This is the criterion that keeps the archived fork from growing back.
  - >
    **F8 — every event kind is accounted for.** A test enumerates the event kinds io-harness emits
    and asserts the renderer's match is exhaustive with no wildcard that silently discards. An event
    this release does not style renders as a muted line; none is dropped. Sabotage: add a catch-all
    arm that returns without rendering, under which only F8 fails.
  - >
    **F9 — 80×24 is supported.** The renderer harness runs the scripted session at 80×24 and asserts
    no panel is truncated mid-word, the composer remains usable, and the status line degrades to its
    narrow form rather than wrapping.
  - >
    **N1 — io-cli contains no second harness.** `cargo tree --depth 1` is recorded in the release
    evidence and reviewed: `io-harness`, `ratatui`, `crossterm`, `tui-textarea`, `clap`, `tokio`,
    `serde`/`toml`, and nothing that constitutes a runtime, a client or a store. Any addition beyond
    that list is argued in the release record or it does not ship.
  - >
    **N2 — the terminal is always restored.** Panic, `Ctrl+C` at any point, and a kill signal each
    leave the terminal in cooked mode with the cursor visible and the scrollback intact. Asserted by
    a test that panics inside a turn and inspects the restore path, and by manual check for the
    signal case.
  - >
    **N3 — no full-screen clear during a session.** The captured byte stream contains no `ESC[2J`
    after startup. This is the flicker criterion, and it is asserted structurally because flicker
    itself cannot be asserted on a CI runner.
  - >
    **N4 — no timing assertion anywhere in this release's tests.** Startup cost and streaming
    smoothness are **recorded as measurements** in the release evidence, not gated. This line of
    repositories has paid for wall-clock assertions on CI runners more than for anything else.
  - >
    **N5 — the credential never reaches the screen, the scrollback, a log line or the trace.** The
    captured byte stream from the F2 scripted wizard is searched for the test key and must not
    contain it. Sabotage: echo the key in the confirmation screen, under which only N5 fails.
  - >
    **N6 — `NO_COLOR` produces a usable session.** With `NO_COLOR=1` the scripted session runs and
    every state that colour distinguishes — success, warning, error, refusal — also carries a word.
  - >
    **N7 — an installer never runs an unverified binary.** Both scripts compute the artifact's
    SHA-256 and compare it against the published `SHA256SUMS` before unpacking, and **abort non-zero
    on a mismatch without leaving anything on disk**. Asserted by running each installer against a
    deliberately corrupted artifact and checking both the exit status and that the target directory
    is untouched. This is the one place in the product where a failure is a security failure rather
    than an inconvenience, and `curl | sh` is a trust-the-publisher model regardless — the checksum
    defends against a truncated download and a tampered asset, not against a compromised repository,
    and the README says so rather than implying more.
  - >
    **N8 — an install needs no administrator rights.** Neither script writes outside the user's own
    directories and neither invokes `sudo`. Asserted by running each as an unprivileged user with no
    write access to any system path.
  - >
    **O2 — the binary builds in release profile.** `cargo build --release` is run and the binary
    executed. CI builds the test profile only, so a release-profile break is invisible to it — this
    has bitten this line of repositories before and is now a standing gate.
remaining_acceptance:
  - >
    **F1 — the live first run.** From an empty `$IO_CONFIG_HOME`, in a real repository, against a
    real provider: the wizard is completed, the key is verified by a live call, the file is written,
    a task is typed, the answer streams, a file is edited inside the sandbox, `Ctrl+C` interrupts a
    second turn mid-flight, and `Ctrl+D` exits. Afterwards, in the same terminal, the transcript is
    searched with the terminal's own search and a passage is selected with the mouse and pasted
    elsewhere. Manual, recorded, and the recording is the release evidence. A fixture cannot prove
    this; only a live run can.
  - >
    **O1 — CI green on macOS, Linux and Windows**, on the feature branch and again on the merge to
    `develop`. Windows is not optional: it is where a terminal renderer's assumptions break, and it
    is where this project has historically found what the other two hid.
  - >
    **O3 — the branch flow is followed exactly.** `feat/0.1.0` off `develop`, one pull request into
    `develop`, merged with the PR button. `develop` to `main` by pull request. Nothing is pushed
    directly to `develop` or `main` at any point. The tag `v0.1.0` is pushed on its own after the
    merge — pushing the tag is what cuts the GitHub Release; creating the Release by hand ships it
    with no assets.
  - >
    **O4 — the repository's own protections are in place or their absence is recorded.** The
    rulesets that make O3 mechanical rather than voluntary require the repository to be public or on
    a paid plan; see the open question. Until then O3 is a discipline, and that fact is stated in
    the release record rather than left implied.
  - >
    **O5 — every artifact in the matrix exists and every installer works on a clean machine.** The
    Release carries all four artifacts plus `SHA256SUMS`. `install.sh` is then run on a clean macOS
    machine and in a clean Linux container, and `install.ps1` on a clean Windows machine, each
    followed by running `io --version` **in a new shell** — which is what catches a script that
    installed correctly and told the user nothing useful about `PATH`. An installer verified only on
    the machine that built it is not verified.
  - >
    **O6 — the Release is cut by pushing the tag, and nothing else.** `gh release create` is never
    used: it produces a Release with no assets. The workflow the tag triggers is what attaches them,
    and the Release title is the bare form this line of repositories uses.
