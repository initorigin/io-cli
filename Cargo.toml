[package]
name = "io-cli"
version = "0.14.0"
edition = "2021"
# io-harness declares 1.95, set by `libsqlite3-sys` calling the std `cfg_select!`
# macro from its build script. Nothing here can be lower than what the harness
# needs, so the floor is copied rather than guessed at.
rust-version = "1.95"
authors = ["Aakash Pawar"]
license = "Apache-2.0"
description = "A terminal agent that shows you what it is allowed to do, what it is spending, and what it refused — while it works."
repository = "https://github.com/initorigin/io-cli"
readme = "README.md"
# This crate is never published. The name holds seventeen yanked versions from an
# archived product, a yank does not free a version number, and the distribution
# decision is prebuilt binaries on the GitHub Release. `publish = false` makes an
# accidental `cargo publish` impossible rather than merely discouraged.
publish = false

# The binary is `io`. The crate is `io-cli` because the bare names are taken on
# crates.io by other people; the two never have to agree.
[[bin]]
name = "io"
path = "src/main.rs"

# The library half exists so the integration tests under `tests/` can reach the
# renderer, the composer and the picker. A binary-only crate cannot be linked by
# an integration test, and F4, F5, F8 and N3 are all integration tests.
[lib]
name = "io_cli"
path = "src/lib.rs"

[dependencies]
# The agent loop, the providers, the tools, the sandbox, the policy engine and the
# session store — all of it. This crate adds none of them; see the F7 test.
#
# `media` is on from 0.9.0. It is what makes `Media`, `Session::attach` and
# `TaskContract::images` exist at all — and it also puts io-harness's own
# `view_image` into `workspace_tools()`, so the agent gains a tool as a
# consequence of enabling it. That is a capability change arriving inside an
# interface release and it is stated in the README and the CHANGELOG rather than
# left to be discovered. It is governed by the same policy as any other read.
io-harness = { version = "0.66", features = ["media", "browser"] }
# ratatui stays at 0.29 and crossterm at 0.28 because `tui-textarea` 0.7 — the
# composer — is built against exactly that pair. The 0.30 line has forks of the
# textarea widget rather than a release of it, and taking one would mean depending
# on somebody's fork of the one widget the composer is made of.
# `unstable-rendered-line-info` is enabled for one method: `Paragraph::line_count`,
# which answers how many rows a wrapped paragraph will occupy. `insert_before`
# takes that height as an argument, and a caller that estimates it truncates
# exactly the content this product exists to keep. It is a feature of a dependency
# already taken, not a dependency.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
tui-textarea = "0.7"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
# The tenth name, and the first added since 0.3.0. `io exec --json` writes each
# `io_harness::RunEvent` as one line of JSON, and the event type derives
# `Serialize` in io-harness itself — which already depends on serde_json
# unconditionally, so nothing new enters the tree and no artifact grows. What is
# bought is not a capability but a correctness property: writing JSON by hand
# would put string escaping for tool output and model replies in this crate.
# Argued in 0.5.0's release record, as `tests/dependencies.rs` requires.
serde_json = "1"
toml = "1"
# Syntax highlighting inside a diff, and the feature set is the load-bearing part
# rather than the version.
#
# `default-features = false` excludes `regex-onig`, which is oniguruma — a C
# library. Two of this product's four artifacts are cross-compiled, to
# `x86_64-unknown-linux-musl` and `x86_64-pc-windows-msvc`, and a native build
# step in that path fails inside the release workflow rather than in a test.
# `regex-fancy` is the pure-Rust engine that replaces it.
#
# `default-themes` is off on purpose: the colours come from io-cli's own token
# set, so a highlighted diff and the rest of the interface are one aesthetic
# instead of two, and `NO_COLOR` keeps working because there is only one place
# that decides colour. `html`, `plist-load` and `yaml-load` are for loading
# grammars and emitting markup at runtime, which this product never does.
#
# `tests/dependencies.rs` asserts this exact feature list. A later
# `default-features = true` would pull the C engine back in silently.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
# The eleventh name, and the first added since 0.5.0. Decoding an image into
# pixels, so a picture can be drawn as half-block cells on a terminal that speaks
# no graphics protocol — the form that has to work everywhere, and the only part
# of 0.9.0 that needs a decoder at all.
#
# `default-features = false` again, and for the same class of reason syntect's is:
# the defaults are `rayon` plus `default-formats`, and `default-formats` pulls
# `avif`, which is `ravif` — an AV1 *encoder* — along with `exr`, `hdr`, `dds`,
# `qoi` and `ff`. None of that decodes anything this crate can be handed.
#
# The list is exactly the formats io-harness will accept from a file, which is the
# set this renderer can ever see: the four that go on a wire unchanged
# (`png`, `jpeg`, `gif`, `webp`) and the five it transcodes to PNG on the way in
# (`bmp`, `tiff`, `ico`, `tga`, `pnm`). io-harness itself declares seven of the
# nine; `gif` and `webp` are added here because the harness never decodes those —
# it passes them through — while a half-block cell needs their pixels. SVG, HEIC
# and AVIF are refused by `Media::attach` by name before this crate sees a byte.
#
# `tests/dependencies.rs` asserts this exact list, as it has asserted syntect's
# since 0.3.0. Nothing here encodes: the base64 a graphics protocol needs is
# already on `Media`, so no base64 crate enters this tree.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "tga",
    "pnm",
] }

[dev-dependencies]
tempfile = "3"
